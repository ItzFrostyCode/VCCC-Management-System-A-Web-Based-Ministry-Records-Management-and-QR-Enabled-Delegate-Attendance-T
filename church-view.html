<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Church Profile — VCCC DAVAO MS</title>
  <link rel="stylesheet" href="./css/app.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="icon" type="image/png" href="./assets/VCCC-Logo.png">
  <style>
    .church-hero {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
    }
    .church-hero::after {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 250px; height: 250px;
      background: radial-gradient(circle, var(--district-theme, var(--red-light)) 0%, transparent 70%);
      opacity: 0.15;
      pointer-events: none;
    }
    .church-name {
      font-size: 32px;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 8px;
      letter-spacing: -0.02em;
      text-transform: uppercase;
    }
    .church-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
    }
    
    /* Current Pastor Section */
    .pastor-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 24px;
      transition: transform 0.2s;
    }
    .pastor-card.vacant {
      border: 2px dashed var(--red);
      background: #fff5f5;
    }
    .pastor-info h4 { margin: 0; font-size: 18px; color: var(--text); }
    .pastor-info p { margin: 4px 0 0; font-size: 14px; color: var(--text-2); }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }
    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 20px;
      border-radius: 12px;
    }
    .stat-value { font-size: 24px; font-weight: 700; color: var(--red); }
    .stat-label { font-size: 12px; font-weight: 600; color: var(--text-3); text-transform: uppercase; }

    .view-section { margin-bottom: 32px; }
    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-title svg { width: 20px; height: 20px; color: var(--red); }

    .history-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }
    .history-table th {
      text-align: left;
      padding: 12px 16px;
      font-size: 12px;
      text-transform: uppercase;
      color: var(--text-3);
      background: var(--bg-body);
      border-bottom: 1px solid var(--border);
    }
    .history-table td {
      padding: 14px 16px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .district-highlight {
      border-left: 4px solid var(--district-theme, var(--red));
      padding-left: 16px;
    }

    /* ─── Lineage Tree Styles ─── */
    .lineage-section-label {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; font-weight: 700; color: var(--text-3);
      text-transform: uppercase; letter-spacing: 0.05em;
      margin-bottom: 12px;
    }
    .lineage-node {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border: 1px solid var(--border);
      border-radius: 12px; background: var(--surface);
      text-decoration: none; color: var(--text);
      transition: all 0.2s; position: relative;
      margin-bottom: 8px;
    }
    .lineage-node:hover { border-color: var(--red); transform: translateX(4px); box-shadow: var(--shadow-sm); }
    .lineage-node.lineage-parent { border-style: solid; border-color: var(--border); }
    .lineage-node.lineage-child { border-color: var(--border); }
    .lineage-empty { border-style: dashed; opacity: 0.6; cursor: default; }
    .lineage-empty:hover { transform: none; box-shadow: none; border-color: var(--border); }
    
    .lineage-avatar {
      width: 32px; height: 32px; border-radius: 8px;
      background: var(--red-light); color: var(--red);
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; font-size: 14px; flex-shrink: 0;
    }
    .lineage-node-info { flex: 1; min-width: 0; }
    .lineage-node-name { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .lineage-node-sub { font-size: 12px; color: var(--text-3); margin-top: 1px; }
    .lineage-arrow { width: 14px; height: 14px; color: var(--text-3); flex-shrink: 0; }

    .lineage-tree-wrapper { position: relative; padding-left: 20px; margin-top: 10px; }
    .lineage-tree-line {
      position: absolute; left: 0; top: -10px; bottom: 20px;
      width: 2px; background: var(--border);
    }
    .lineage-tree-item { position: relative; margin-bottom: 24px; }
    .lineage-tree-item::before {
      content: ''; position: absolute; left: -20px; top: 22px;
      width: 20px; height: 2px; background: var(--border);
    }
  </style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a href="/" class="sidebar-logo"><img src="assets/VCCC-Logo.png" class="sidebar-logo-img" alt="Logo" /></a>
    <nav class="sidebar-nav">
       <a href="/index.html" class="nav-item" data-page="dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></a>
       <a href="/church.html" class="nav-item active" data-page="church"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></a>
    </nav>
  </aside>
  <div class="app-main">
    <header class="topbar">
      <button class="btn-icon" id="btn-back" style="margin-right:12px;">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="topbar-title">Church Profile</div>
    </header>
    <main class="page-content">
      <div id="loading-state" style="padding:100px; text-align:center;">
        <div class="skeleton" style="width:300px; height:40px; margin: 0 auto 16px;"></div>
        <div class="skeleton" style="width:200px; height:24px; margin: 0 auto;"></div>
      </div>

      <div id="content-area" style="display:none;">
        <div class="church-hero" id="church-hero">
          <div id="c-name" class="church-name"></div>
          <div class="church-meta">
            <span id="c-scope" class="pill pill-primary"></span>
            <span id="c-address" class="pill pill-ghost"></span>
          </div>
          <div style="font-size:14px; color:var(--text-2); max-width: 800px; margin-top:16px;" id="c-notes"></div>
        </div>

        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-label">Status</div>
            <div id="stat-status" class="stat-value">Occupied</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Pastors Assigned</div>
            <div id="stat-pastors" class="stat-value">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Years Active</div>
            <div id="stat-years" class="stat-value">0</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">District</div>
            <div id="stat-district" class="stat-value" style="font-size:18px;">—</div>
          </div>
        </div>

        <div class="view-section">
          <h3 class="section-title"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M18 21v-2a4 4 0 0 0-4-4H10a4 4 0 0 0-4 4v2"/></svg> Current Pastor</h3>
          <div id="current-pastor-container">
            <!-- Injected by pastor-view.js -->
          </div>
        </div>

        <div class="view-section">
          <h3 class="section-title"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> District Context</h3>
          <div class="pastor-card district-highlight" id="district-context">
            <div class="pastor-info">
              <h4 id="d-name">—</h4>
              <p id="d-leader">District Leader: <span>—</span></p>
              <p id="d-notes" style="margin-top:8px; font-style:italic; font-size:12px;"></p>
            </div>
          </div>
        </div>

        <div class="view-section">
          <h3 class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg> Organizational Lineage</h3>
          <div id="church-lineage-tree">
             <!-- Injected by church-view.js -->
          </div>
        </div>

        <div class="view-section">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 16px;">
            <h3 class="section-title" style="margin-bottom:0;"><svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg> Ministry Timeline</h3>
            <button class="btn btn-primary btn-sm" onclick="openHistoricalModal()">+ Historical Record</button>
          </div>
          <div id="master-timeline" class="history-timeline">
            <!-- Injected by timeline.service -->
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Add Historical Record Modal -->
<div class="modal-overlay" id="modal-historical" onclick="if(event.target===this)closeModal('modal-historical')">
  <div class="modal-box" style="max-width: 500px;">
    <div class="modal-head">
      <div class="modal-title">Add Historical Assignment</div>
      <button class="modal-close" type="button" onclick="closeModal('modal-historical')">&times;</button>
    </div>
    <div class="modal-body">
      <form id="form-historical" style="display:flex; flex-direction:column; gap:16px;">
        <div class="form-field">
          <label class="form-label">Pastor</label>
          <select id="hist-pastor" class="select-input" required>
            <!-- Injected pastors list -->
          </select>
        </div>
        <div class="form-row-2">
          <div class="form-field">
            <label class="form-label">Start Date</label>
            <input type="date" id="hist-start" class="input" required />
          </div>
          <div class="form-field">
            <label class="form-label">End Date</label>
            <input type="date" id="hist-end" class="input" required />
          </div>
        </div>
        <div class="form-row-2">
          <div class="form-field">
            <label class="form-label">Role</label>
            <select id="hist-role" class="select-input" required>
              <option value="Lead Pastor">Lead Pastor</option>
              <option value="Assistant Pastor">Assistant Pastor</option>
              <option value="District Presbyter">District Presbyter</option>
              <option value="Interim Setup">Interim Setup</option>
            </select>
          </div>
          <div class="form-field">
            <label class="form-label">Event Type</label>
            <select id="hist-event" class="select-input" required>
              <option value="Legacy Assignment" selected>Legacy Assignment</option>
              <option value="Transfer">Transfer</option>
              <option value="Pioneering">Pioneering</option>
              <option value="Takeover">Takeover</option>
            </select>
          </div>
        </div>
        <div class="form-field">
          <label class="form-label">Notes / Source</label>
          <textarea id="hist-notes" class="input" style="height:auto; padding:10px 14px;" rows="2" placeholder="e.g. Added from physical ledger"></textarea>
        </div>
        <div class="modal-foot" style="margin-top:8px; padding:0; border:none;">
          <button type="button" class="btn btn-ghost" onclick="closeModal('modal-historical')">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-submit-historical">Save Record</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Scripts -->
<script src="./js/libs/supabase.min.js"></script>
<script type="module" src="./js/pages/church-view.js"></script>
</body>
</html>
