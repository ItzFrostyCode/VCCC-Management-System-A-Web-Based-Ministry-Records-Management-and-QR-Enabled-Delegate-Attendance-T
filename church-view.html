<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Church Profile — VCCC DAVAO MS</title>
  <link rel="stylesheet" href="./css/app.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="css/components.css" /> <!-- Keeping original index -->
  <link rel="stylesheet" href="components/button/button.css" />
  <link rel="stylesheet" href="components/form/form.css" />
  <link rel="stylesheet" href="components/modal/modal.css" />
  <link rel="stylesheet" href="components/table/table.css" />
  <link rel="stylesheet" href="components/filter-bar/filter-bar.css" />
  <link rel="stylesheet" href="components/search-select/search-select.css" />
  <link rel="stylesheet" href="components/avatar/avatar.css" />
  <link rel="stylesheet" href="components/stats/stats.css" />
  <link rel="stylesheet" href="components/tabs/tabs.css" />
  <link rel="stylesheet" href="components/badge/badge.css" />
  <link rel="stylesheet" href="components/history/history.css" />
  <link rel="stylesheet" href="components/password/password.css" />
  <link rel="icon" type="image/png" href="./assets/VCCC-Logo.png">
  <link rel="stylesheet" href="css/pages/church-view.css" />
</head>
<body>
<div class="app-shell">
  <div id="sidebar-container"></div>
  <div class="app-main">
    <header class="topbar">
      <button class="btn-icon" id="btn-back" style="margin-right:12px;">
        <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div class="topbar-title">Church Profile</div>
    </header>
    <main class="page-content" id="main-content">
      <div id="loading-state" style="padding:100px; text-align:center;">
        <div class="skeleton" style="width:300px; height:40px; margin: 0 auto 16px;"></div>
        <div class="skeleton" style="width:200px; height:24px; margin: 0 auto;"></div>
      </div>

      <div id="content-area" class="profile-container" style="display:none;">
        
        <!-- Unified Hero Banner -->
        <div class="church-hero-banner" id="church-hero">
          <div class="hero-banner-accent"></div>
          <div class="hero-banner-content">
            <div class="hero-top-row">
              <div class="church-avatar-box" id="c-avatar">C</div>
              <div class="hero-main-info">
                <div class="church-name-display" id="c-name">Church Name</div>
                <div class="church-address-display">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                  <span id="c-address">Address Here</span>
                  <span class="pill pill-primary" id="c-scope" style="margin-left:8px; font-size:10px;">LOCAL</span>
                </div>
                
                <div class="church-mini-stats">
                  <div class="mini-stat-pill" id="stat-status-wrap">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                    <span class="mini-stat-val" id="stat-status">Occupied</span>
                  </div>
                  <div class="mini-stat-pill">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    <span class="mini-stat-lbl">District</span>
                    <span class="mini-stat-val" id="stat-district">—</span>
                  </div>
                  <div class="mini-stat-pill">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>
                    <span class="mini-stat-lbl">Pastors</span>
                    <span class="mini-stat-val" id="stat-pastors">0</span>
                  </div>
                  <div class="mini-stat-pill">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                    <span class="mini-stat-lbl">Years Active</span>
                    <span class="mini-stat-val" id="stat-years">0</span>
                  </div>
                </div>
              </div>
            </div>
            <div id="c-notes-wrap" style="display:none;">
              <div class="church-notes-box" id="c-notes"></div>
            </div>
          </div>
        </div>

        <!-- 2-Column Desktop Grid -->
        <div class="profile-dual-grid">
          
          <!-- LEFT COLUMN: Operations -->
          <div class="profile-col-main">
            <div class="view-section">
              <div class="section-head">
                <h3 class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M18 21v-2a4 4 0 0 0-4-4H10a4 4 0 0 0-4 4v2"/></svg> Current Pastor</h3>
              </div>
              <div id="current-pastor-container">
                <!-- Injected by church-view.js -->
              </div>
            </div>

            <div class="view-section">
              <div class="section-head">
                <h3 class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg> Ministry Timeline</h3>
                <button class="btn btn-primary btn-sm" onclick="openHistoricalModal()">+ Historical Record</button>
              </div>
              <div id="master-timeline" class="history-timeline">
                <!-- Injected by timeline.service -->
              </div>
            </div>
          </div>

          <!-- RIGHT COLUMN: Context & Lineage -->
          <div class="profile-col-side">
            <div class="view-section">
              <div class="section-head">
                <h3 class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> District Context</h3>
              </div>
              <div class="context-box" id="district-context">
                <h4 id="d-name">—</h4>
                <p id="d-leader">Leader: <span>—</span></p>
                <p id="d-notes" style="margin-top:6px; font-style:italic; font-size:11px;"></p>
              </div>
            </div>

            <div class="view-section">
              <div class="section-head">
                <h3 class="section-title"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg> Organizational Lineage</h3>
              </div>
              <div id="church-lineage-tree">
                 <!-- Injected by church-view.js -->
              </div>
            </div>
          </div>

        </div>
      </div>
    </main>
  </div>
</div>

<!-- Add Historical Record Modal -->
<div class="modal-overlay" id="modal-historical" onclick="if(event.target===this)closeModal('modal-historical')">
  <div class="modal-box" style="max-width: 500px;">
    <div class="modal-head">
      <div class="modal-title">Add Historical Assignment</div>
      <button class="modal-close" type="button" onclick="closeModal('modal-historical')">&times;</button>
    </div>
    <div class="modal-body">
      <form id="form-historical" style="display:flex; flex-direction:column; gap:16px;">
        <div class="form-field">
          <label class="form-label">Pastor</label>
          <select id="hist-pastor" class="select-input" required>
            <!-- Injected pastors list -->
          </select>
        </div>
        <div class="form-row-2">
          <div class="form-field">
            <label class="form-label">Start Date</label>
            <input type="date" id="hist-start" class="input" required />
          </div>
          <div class="form-field">
            <label class="form-label">End Date</label>
            <input type="date" id="hist-end" class="input" required />
          </div>
        </div>
        <div class="form-row-2">
          <div class="form-field">
            <label class="form-label">Role</label>
            <select id="hist-role" class="select-input" required>
              <option value="Lead Pastor">Lead Pastor</option>
              <option value="Assistant Pastor">Assistant Pastor</option>
              <option value="District Presbyter">District Presbyter</option>
              <option value="Interim Setup">Interim Setup</option>
            </select>
          </div>
          <div class="form-field">
            <label class="form-label">Event Type</label>
            <select id="hist-event" class="select-input" required>
              <option value="Legacy Assignment" selected>Legacy Assignment</option>
              <option value="Transfer">Transfer</option>
              <option value="Pioneering">Pioneering</option>
              <option value="Takeover">Takeover</option>
            </select>
          </div>
        </div>
        <div class="form-field">
          <label class="form-label">Notes / Source</label>
          <textarea id="hist-notes" class="input" style="height:auto; padding:10px 14px;" rows="2" placeholder="e.g. Added from physical ledger"></textarea>
        </div>
        <div class="modal-foot" style="margin-top:8px; padding:0; border:none;">
          <button type="button" class="btn btn-ghost" onclick="closeModal('modal-historical')">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-submit-historical">Save Record</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Scripts -->
<!-- Image Viewer Modal -->
<div class="modal-overlay" id="modal-image-viewer" onclick="if(event.target===this)closeImageViewer()">
  <div class="modal-box" style="max-width:800px; background:transparent; border:none; box-shadow:none;">
    <div class="modal-head" style="border:none; padding:10px 0;">
      <div class="modal-title" id="image-viewer-title" style="color:#fff;">View Image</div>
      <button class="modal-close" onclick="closeImageViewer()" style="background:rgba(255,255,255,0.1); color:#fff;">&times;</button>
    </div>
    <div class="modal-body" style="padding:0; align-items:center; justify-content:center; display:flex;">
      <img id="full-image-display" class="modal-img-full" src="" alt="Full size image" style="display:none;" />
      <div id="full-initials-display" style="display:none; width:150px; height:150px; border-radius:50%; background:var(--red); color:white; font-size:64px; font-weight:800; align-items:center; justify-content:center; margin:40px auto;"></div>
    </div>
  </div>
</div>

<script src="js/libs/supabase.min.js"></script>
<script type="module" src="js/pages/church-view.controller.js"></script>
</body>
</html>
