<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Badge Generator — VCCC DAVAO MS</title>
<link rel="stylesheet" href="css/app.css" />
<link rel="icon" type="image/png" href="assets/VCCC-Logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Public+Sans:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/layout.css?v=2" />
<link rel="stylesheet" href="css/components.css?v=2" />
<link rel="stylesheet" href="css/pages/badges.css?v=2" />
</head>
<body class="badges-page">
<div class="app-shell">

  <!-- ─── Sidebar (desktop only) ─── -->
  <aside class="sidebar">
    <a href="/" class="sidebar-logo">
      <img src="assets/VCCC-Logo.png" class="sidebar-logo-img" alt="VCCC Logo" />
    </a>


    <nav class="sidebar-nav">
      <a href="/index.html"       class="nav-item" data-page="dashboard"   data-tip="Dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></a>
      <a href="/pastors.html"     class="nav-item" data-page="pastors"     data-tip="Pastors"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.87"/></svg></a>
      <a href="/disciples.html"   class="nav-item" data-page="disciples"   data-tip="Disciples"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20v-2a8 8 0 0 1 16 0v2"/></svg></a>
      <div class="sidebar-divider"></div>
      <a href="/church.html"      class="nav-item" data-page="church"      data-tip="Church"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></a>
      <a href="/assignment.html"  class="nav-item" data-page="assignment"  data-tip="Assignment"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/></svg></a>
      <a href="/district.html"    class="nav-item" data-page="district"    data-tip="District"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></a>
      <div class="sidebar-divider"></div>
      <a href="/conferences.html" class="nav-item" data-page="conferences" data-tip="Conferences"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></a>
      <a href="/badges.html"      class="nav-item active" data-page="badges" data-tip="Badges"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg></a>
      <a href="/scanner.html"     class="nav-item" data-page="scanner"     data-tip="Scanner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="3" y1="12" x2="21" y2="12"/></svg></a>
      <div class="sidebar-divider"></div>
      <a href="/admin_logs.html"  class="nav-item admin-only" data-page="logs" data-tip="Activity Logs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></a>
    </nav>
    <div class="sidebar-bottom">
      <div class="sidebar-divider"></div>
      <button class="nav-item" id="btn-logout" data-tip="Sign Out" style="cursor:pointer;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>

  <!-- ─── Main App ─── -->
  <div class="app-main">

    <!-- Topbar -->
    <header class="bg-topbar topbar">
      <div class="topbar-brand">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
        Badge Generator
      </div>



      <div class="topbar-mid">
        <span class="badge-dim-label" id="coords-label">8.89 × 6.35 cm</span>
      </div>


      <div class="topbar-actions">
        <!-- Unified Export ZIP Button -->
        <button type="button" class="tb-zip-btn" id="btn-export-all" title="Export ZIP">
           <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ─── Editor Shell ─── -->
    <div class="editor-shell">

      <!-- LEFT: Slide/Delegate Panel -->
      <aside class="slides-panel" id="view-delegates">
        <!-- Filters -->
        <div class="slides-search">
          <div class="ss-search-wrap">
            <svg viewBox="0 0 24 24" class="ss-search-icon"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="search-delegate" class="ss-search-input" placeholder="Search delegates..." />
          </div>
          <div class="ss-filter-row">
            <div id="filter-district-badge" class="ss-filter-slot"></div>
            <div id="filter-church-badge" class="ss-filter-slot"></div>
          </div>
          <div class="ss-role-chips">
            <button type="button" class="role-chip on chip-pastor"   data-role="PASTOR"   id="chip-pastor">Pastor</button>
            <button type="button" class="role-chip on chip-wife"     data-role="WIFE"     id="chip-wife">Wife</button>
            <button type="button" class="role-chip on chip-disciple" data-role="DISCIPLE" id="chip-disciple">Disciple</button>
          </div>
          <div class="ss-count" id="delegate-count">0 results</div>
          <div id="delegate-count-status" style="margin-top: 4px; font-size: 11px;"></div>
        </div>

        <!-- Delegate list -->
        <div class="slides-list" id="delegate-list"></div>
      </aside>

      <!-- CENTER: Canvas Workspace -->
      <main class="canvas-workspace" id="view-preview">
        <div class="canvas-bg">
          <div class="canvas-frame" id="badge-preview-wrap">
            <div class="no-selection" id="no-selection-msg">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
              <p>Pick a delegate from the left to preview their badge</p>
            </div>
          </div>
          <div class="canvas-actions" id="canvas-actions" style="display:none;">
            <button class="ca-btn" id="btn-download-jpg">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
              Save JPEG
            </button>
            <button class="ca-btn ca-btn-ghost" id="btn-print-badge">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
              Print
            </button>
          </div>

          <!-- Mobile Editor Container (appears below badge on mobile) -->
          <div id="mobile-mini-editor" class="mobile-only"></div>
        </div>

        <!-- Legacy Batch progress bar (hidden in favor of modal) -->
        <div id="batch-progress" style="display:none;" class="batch-bar-wrap"></div>
      </main>

      <!-- RIGHT: Properties Panel -->
      <aside class="props-panel" id="view-tools">
        <div class="props-header">Properties</div>
        <div class="props-body" id="editor-fields-body">
          <div class="props-loading">Loading editor...</div>
        </div>
      </aside>

    </div>

    <!-- Mobile Tab Bar -->
    <nav class="mobile-tabbar mobile-only">
      <button class="tab-btn active" data-view="delegates" id="btn-tab-delegates">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg>
        Delegates
      </button>
      <button class="tab-btn" data-view="preview" id="btn-tab-preview">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
        Preview
      </button>
    </nav>

  </div><!-- /app-main -->
</div><!-- /app-shell -->

<!-- ─── Unified Export Modal (NUCLEAR STABILITY RESTORED) ─── -->
<div id="modal-download" class="modal-system-wrap" style="display:none;">
  <div class="modal-backdrop" id="btn-close-backdrop"></div>
  <div class="aesthetic-modal">
    <div class="modal-header">
      <div>
        <h3>Export Badges ZIP</h3>
        <p class="modal-subtitle">Filter by District, Church, or Select All</p>
      </div>
        <button type="button" class="btn-close" id="btn-close-download-modal">&times;</button>
    </div>
    <div class="modal-body">
      <div id="modal-download-content">
         <!-- Content will be rendered via JS -->
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" class="mf-btn mf-ghost" id="btn-cancel-download">Cancel</button>
      <button type="button" class="mf-btn mf-primary" id="btn-modal-generate">
        Generate ZIP
      </button>
    </div>
  </div>
</div>

<!-- ─── Export Progress Modal ─── -->
<div id="modal-export-progress" class="modal-system-wrap" style="display:none; z-index: 20000;">
  <div class="modal-backdrop"></div>
  <div class="aesthetic-modal" style="max-width: 400px;">
    <div class="modal-body" style="padding: 40px 30px 28px; text-align: center;">
      <div class="export-loading-icon">
        <svg id="export-modal-spinner" viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="var(--primary)" stroke-width="1.5" style="animation: spin 2s linear infinite;">
          <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
        </svg>
      </div>
      <h3 id="export-modal-title" style="margin: 20px 0 6px; font-size: 18px;">Generating Badges</h3>
      <p id="export-modal-label" style="font-size: 13px; color: var(--text-3); margin-bottom: 20px; min-height: 18px;">Preparing files...</p>
      
      <div class="batch-bar" style="height: 8px; background: var(--bg-shell); border-radius: 99px; overflow: hidden;">
        <div id="export-modal-fill" class="batch-fill" style="width: 0%; height: 100%; background: var(--primary); transition: width 0.3s ease;"></div>
      </div>
      <div id="export-modal-percent" style="margin-top: 8px; font-weight: 800; color: var(--primary); font-size: 14px;">0%</div>

      <!-- Cancel button — visible during rendering -->
      <button id="export-modal-cancel" type="button"
        style="margin-top: 20px; display: inline-flex; align-items: center; gap: 6px; height: 36px; padding: 0 20px; border-radius: 99px; border: 1.5px solid #ef4444; background: #fff; color: #ef4444; font-size: 13px; font-weight: 600; cursor: pointer; transition: all 0.15s;">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        Cancel Export
      </button>
    </div>
    <!-- Done / Dismissed footer — visible after finish or cancel -->
      <div class="modal-footer" id="export-modal-footer" style="display:none; justify-content: center; padding: 15px 30px; background: #fff; border-top: 1px solid var(--border);">
        <button type="button" class="mf-btn mf-primary" onclick="this.closest('.modal-system-wrap').style.display='none'">Dismiss</button>
      </div>
    </div>
  </div>
</div>

<script src="js/libs/supabase.min.js"></script>
<script src="js/libs/qrcode.min.js"></script>
<script src="js/libs/jszip.min.js"></script>
<script src="js/pages/badges.js" type="module"></script>
</body>
</html>
