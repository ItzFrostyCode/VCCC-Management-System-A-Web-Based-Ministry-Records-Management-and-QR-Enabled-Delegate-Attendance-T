<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>District Dashboard — VCCC DAVAO MS</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" /> <!-- Keeping original index -->
  <link rel="stylesheet" href="components/button/button.css" />
  <link rel="stylesheet" href="components/form/form.css" />
  <link rel="stylesheet" href="components/modal/modal.css" />
  <link rel="stylesheet" href="components/table/table.css" />
  <link rel="stylesheet" href="components/filter-bar/filter-bar.css" />
  <link rel="stylesheet" href="components/search-select/search-select.css" />
  <link rel="stylesheet" href="components/avatar/avatar.css" />
  <link rel="stylesheet" href="components/stats/stats.css" />
  <link rel="stylesheet" href="components/tabs/tabs.css" />
  <link rel="stylesheet" href="components/badge/badge.css" />
  <link rel="stylesheet" href="components/history/history.css" />
  <link rel="stylesheet" href="components/password/password.css" />
  <link rel="icon" type="image/png" href="assets/VCCC-Logo.png">
  <link rel="stylesheet" href="css/pages/district-view.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-container"></div>

  <div class="app-main">
    <header class="topbar">
      <div class="topbar-left" style="display:flex; align-items:center; gap:12px;">
        <a href="district.html" class="btn btn-ghost" style="width:36px; padding:0; height:36px; border-radius:50%;"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg></a>
        <div class="topbar-title">District View</div>
      </div>
    </header>

    <div id="loading-state">
      <div class="spinning"><svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="currentColor" stroke-width="3"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48l2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48l2.83-2.83"/></svg></div>
      <p style="margin-top:16px;">Loading District Dashboard...</p>
    </div>

    <main class="page-content" id="main-content" style="display:none;">
      <!-- District Header -->
      <div class="district-header">
        <div class="district-hero" id="district-hero">
          <div class="district-hero-title" id="d-name-hero">DISTRICT NAME</div>
        </div>
        <div class="district-info-bar">
          <div class="leader-profile">
            <div class="leader-avatar" id="leader-avatar"></div>
            <div>
              <div style="font-size:11px; font-weight:700; color:var(--text-3); text-transform:uppercase;">District Leader</div>
              <div style="font-size:16px; font-weight:700; color:var(--text);" id="leader-name">—</div>
            </div>
          </div>
          <div id="d-notes" style="font-size:13px; color:var(--text-2); max-width:400px; line-height:1.4;"></div>
        </div>
      </div>

      <!-- Stats Grid -->
      <div class="view-stats">
        <div class="stat-box">
          <div class="stat-box-val" id="stat-total">0</div>
          <div class="stat-box-label">Total Churches</div>
        </div>
        <div class="stat-box">
          <div class="stat-box-val" style="color:#2e7d32;" id="stat-occupied">0</div>
          <div class="stat-box-label">Occupied</div>
        </div>
        <div class="stat-box" style="border-left: 3px solid var(--red);">
          <div class="stat-box-val" style="color:var(--red);" id="stat-vacant">0</div>
          <div class="stat-box-label">Vacant Churches</div>
        </div>
        <div class="stat-box">
          <div class="stat-box-val" id="stat-pastors">0</div>
          <div class="stat-box-label">Active Pastors</div>
        </div>
      </div>

      <!-- Filters -->
      <div class="filter-bar">
        <div class="search-wrap"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input type="text" id="search-input" placeholder="Search churches..." /></div>
        <select class="input" id="filter-status" style="width:160px;">
          <option value="all">All Churches</option>
          <option value="occupied">Occupied</option>
          <option value="vacant">Vacant</option>
        </select>
      </div>

      <!-- Church List -->
      <div id="church-list" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(360px, 1fr)); gap:16px;">
        <!-- Filled by JS -->
      </div>
    </main>
  </div>
</div>

<script src="js/libs/supabase.min.js"></script>
<script type="module" src="js/pages/district-view.controller.js"></script>
<script type="module" src="./js/utils/guide.js"></script>
</body>
</html>
