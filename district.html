<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>District — VCCC DAVAO MS</title>
  <link rel="stylesheet" href="./css/app.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="css/components.css" /> <!-- Keeping original index -->
  <link rel="stylesheet" href="components/button/button.css" />
  <link rel="stylesheet" href="components/form/form.css" />
  <link rel="stylesheet" href="components/modal/modal.css" />
  <link rel="stylesheet" href="components/table/table.css" />
  <link rel="stylesheet" href="components/filter-bar/filter-bar.css" />
  <link rel="stylesheet" href="components/search-select/search-select.css" />
  <link rel="stylesheet" href="components/avatar/avatar.css" />
  <link rel="stylesheet" href="components/stats/stats.css" />
  <link rel="stylesheet" href="components/tabs/tabs.css" />
  <link rel="stylesheet" href="components/badge/badge.css" />
  <link rel="stylesheet" href="components/history/history.css" />
  <link rel="stylesheet" href="components/password/password.css" />
  <link rel="icon" type="image/png" href="./assets/VCCC-Logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-container"></div>
  <div class="app-main">

  <div class="app-main">
    <header class="topbar"><div class="topbar-title">District</div></header>
    <main class="page-content" id="main-content">
      <!-- Header -->
      <div class="page-header">
        <div class="page-header-info">
          <h1 class="page-header-title">District Management</h1>
          <span class="page-header-count" id="district-count">0 total</span>
        </div>
        <div class="page-header-actions">
          <button class="btn btn-ghost" id="btn-export">
            <svg viewBox="0 0 24 24"><polyline points="8 17 12 21 16 17"/><line x1="12" y1="3" x2="12" y2="21"/></svg>
            Export Data
          </button>
          <button class="btn btn-primary" id="btn-add-district">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Add New District
          </button>
        </div>
      </div>

      <!-- District Tree Hierarchy -->
      <div id="district-tree" class="district-tree">
        <!-- Districts and Churches will be injected here -->
        <div class="empty-state">
          <div class="skeleton" style="width:100%; height:60px; border-radius:12px; margin-bottom:12px;"></div>
          <div class="skeleton" style="width:100%; height:60px; border-radius:12px; margin-bottom:12px;"></div>
        </div>
      </div>
    </main>
  </div>
</div>

  <link rel="stylesheet" href="css/pages/district.css" />


<!-- District Modal (Basic Info) -->
<div class="modal-overlay" id="district-modal-overlay">
  <div class="modal-box">
    <div class="modal-head">
      <h2 class="modal-title" id="modal-title">Add New District</h2>
      <button class="modal-close" id="btn-close-modal">&times;</button>
    </div>
    <form id="district-form">
      <div class="modal-body">
        <input type="hidden" id="district-id" />
        <div class="form-field">
          <label class="form-label">District Name <span class="req">*</span></label>
          <input type="text" id="f-name" class="input" placeholder="e.g. DISTRICT 1" required />
        </div>
        <div class="form-field">
          <label class="form-label">Theme Color</label>
          <div style="display:flex; gap:10px; align-items:center;">
            <input type="color" id="f-color" value="#e83820" style="width:42px; height:42px; border:none; padding:0; background:none; cursor:pointer;" />
            <span id="color-hex" style="font-family:monospace; font-size:12px; color:var(--text-3);">#E83820</span>
          </div>
        </div>
        <div class="form-field">
          <label class="form-label">Leader Pastor</label>
          <div id="f-leader-sel"></div>
        </div>
        <div class="form-field">
          <label class="form-label">Notes</label>
          <textarea id="f-notes" class="input" style="height:60px; padding-top:10px; resize:none;" placeholder="Notes..."></textarea>
        </div>
      </div>
      <div class="modal-foot" style="justify-content: space-between;">
        <button type="button" class="btn btn-ghost" id="btn-delete-district" style="color: var(--red); display: none;">Delete District</button>
        <div style="display:flex; gap:10px;">
          <button type="button" class="btn btn-ghost" id="btn-cancel-modal">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-save-district">Save District</button>
        </div>
      </div>
    </form>
  </div>
</div>

<!-- Church Modal (Triggered by + in District Header) -->
<div class="modal-overlay" id="nested-church-modal-overlay">
  <div class="modal-box">
    <div class="modal-head">
      <h2 class="modal-title">Add New Church</h2>
      <button type="button" class="modal-close" id="btn-close-nested-modal">&times;</button>
    </div>
    <form id="nested-church-form">
      <div class="modal-body">
        <input type="hidden" id="n-f-dist-id" />
        
        <!-- Toggle Mode -->
        <div class="segment-control" style="margin-bottom: 20px;" id="church-mode-control">
          <label class="segment-item">
            <input type="radio" name="church-mode" value="select" checked />
            <span>Select Existing</span>
          </label>
          <label class="segment-item">
            <input type="radio" name="church-mode" value="create" />
            <span>Create New</span>
          </label>
        </div>

        <!-- Mode 1: Select Existing -->
        <div id="mode-select-church">
          <div class="form-field">
            <label class="form-label">Available Churches</label>
            <select id="n-f-select-church" class="input">
              <option value="">-- Choose Church --</option>
            </select>
            <div style="font-size: 11px; color: var(--text-3); margin-top: 4px;">Only churches not yet assigned to a district are shown.</div>
          </div>
        </div>

        <!-- Mode 2: Create New -->
        <div id="mode-create-church" style="display:none;">
          <div class="form-field">
            <label class="form-label">Church Name <span class="req">*</span></label>
            <input type="text" id="n-f-name" class="input" placeholder="e.g. DAVAO" />
          </div>

          <div class="form-field">
            <label class="form-label">Address <span class="req">*</span></label>
            <textarea id="n-f-address" class="input" style="height:60px; padding-top:10px; resize:none;" placeholder="Complete address..."></textarea>
          </div>

          <div class="form-field">
            <label class="form-label">Location Type</label>
            <div style="display:flex; gap:20px; align-items:center; padding:10px 0;">
              <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:14px;">
                <input type="radio" name="n-f-type" value="Local" checked /> Local
              </label>
              <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:14px;">
                <input type="radio" name="n-f-type" value="International" /> International
              </label>
            </div>
          </div>

          <div class="form-field">
            <label class="form-label">Notes <span class="opt">(Optional)</span></label>
            <textarea id="n-f-notes" class="input" style="height:60px; padding-top:10px; resize:none;" placeholder="Additional details..."></textarea>
          </div>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost btn-sm" id="btn-cancel-nested-modal">Cancel</button>
        <button type="submit" class="btn btn-primary btn-sm">Create & Add</button>
      </div>
    </form>
  </div>
</div>

<!-- Pastor Assignment Modal (Triggered by Vacant Status) -->
<div class="modal-overlay" id="assignment-modal-overlay" style="z-index: 2000;">
  <div class="modal-box modal-sm">
    <div class="modal-head">
      <h2 class="modal-title">Assign Pastor</h2>
      <button type="button" class="modal-close" id="btn-close-assign-modal">&times;</button>
    </div>
    <form id="assignment-form">
      <div class="modal-body">
        <input type="hidden" id="assign-church-id" />
        <div class="form-field">
          <label class="form-label">Select Pastor to Assign</label>
          <select id="assign-pastor-select" class="input" required>
            <option value="">-- Select a Pastor --</option>
          </select>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost btn-sm" id="btn-cancel-assign-modal">Cancel</button>
        <button type="submit" class="btn btn-primary btn-sm">Confirm Assignment</button>
      </div>
    </form>
  </div>
</div>


  </div>
</div>

<script src="js/libs/supabase.min.js"></script>
<script type="module" src="js/pages/district.controller.js"></script>
</body>
</html>
