<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — VCCC DAVAO MS</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" /> <!-- Keeping original index -->
  <link rel="stylesheet" href="components/button/button.css" />
  <link rel="stylesheet" href="components/form/form.css" />
  <link rel="stylesheet" href="components/modal/modal.css" />
  <link rel="stylesheet" href="components/table/table.css" />
  <link rel="stylesheet" href="components/filter-bar/filter-bar.css" />
  <link rel="stylesheet" href="components/search-select/search-select.css" />
  <link rel="stylesheet" href="components/avatar/avatar.css" />
  <link rel="stylesheet" href="components/stats/stats.css" />
  <link rel="stylesheet" href="components/tabs/tabs.css" />
  <link rel="stylesheet" href="components/badge/badge.css" />
  <link rel="stylesheet" href="components/history/history.css" />
  <link rel="stylesheet" href="components/password/password.css" />
  <link rel="stylesheet" href="css/pages/dashboard.css" /> <!-- NEW DASHBOARD STYLES -->
  <link rel="icon" type="image/png" href="assets/VCCC-Logo.png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div class="app-shell">

  <!-- Sidebar -->
  <aside class="sidebar">
    <a href="/index.html" class="sidebar-logo">
      <img src="assets/VCCC-Logo.png" class="sidebar-logo-img" alt="VCCC Logo" />
    </a>
    <nav class="sidebar-nav">
      <!-- People -->
      <a href="/index.html"       class="nav-item active" data-page="dashboard"   data-tip="Dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></a>
      <a href="/pastors.html"     class="nav-item" data-page="pastors"     data-tip="Pastors"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.87"/></svg></a>
      <a href="/disciples.html"   class="nav-item" data-page="disciples"   data-tip="Disciples"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20v-2a8 8 0 0 1 16 0v2"/></svg></a>
      <!-- Church Org -->
      <div class="sidebar-divider"></div>
      <a href="/assignment.html"  class="nav-item" data-page="assignment"  data-tip="Assignment"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/><polyline points="9 9 9 9"/></svg></a>
      <a href="/church.html"      class="nav-item" data-page="church"      data-tip="Churches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></a>
      <a href="/district.html"    class="nav-item" data-page="district"    data-tip="Districts"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></a>
      <!-- Events -->
      <div class="sidebar-divider"></div>
      <a href="/conferences.html" class="nav-item" data-page="conferences" data-tip="Conferences"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></a>
      <a href="/badges.html"      class="nav-item" data-page="badges"      data-tip="Badges"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg></a>
      <a href="/scanner.html"     class="nav-item" data-page="scanner"     data-tip="Scanner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="3" y1="12" x2="21" y2="12"/></svg></a>
      <!-- Data -->
      <div class="sidebar-divider"></div>
      <a href="/admin_logs.html"  class="nav-item admin-only" data-page="logs" data-tip="Activity Logs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></a>
    </nav>
    <div class="sidebar-bottom">
      <div class="sidebar-divider"></div>
      <button class="nav-item" id="btn-logout" data-tip="Sign Out" style="cursor:pointer;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>

  <!-- Main -->
  <div class="app-main">
    <header class="topbar">
      <div class="topbar-title">System Overview</div>
    </header>

    <main class="page-content" id="main-content">
      
      <!-- 1. KPI CARDS -->
      <div class="kpi-grid" id="kpi-container">
        <!-- Rendered by JS -->
        <div class="kpi-card skeleton"></div><div class="kpi-card skeleton"></div>
        <div class="kpi-card skeleton"></div><div class="kpi-card skeleton"></div>
      </div>

      <!-- ROW 2: Alerts Panel -->
      <div class="dash-panel" style="border-top: 3px solid var(--red); margin-bottom: 24px;">
        <div class="dash-panel-header">
          <span class="dash-panel-title" style="color: var(--red);">
            <svg viewBox="0 0 24 24" stroke="currentColor"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
            Critical Alerts & Action Required
          </span>
        </div>
        <div class="dash-panel-body" id="alerts-panel">
          <div class="panel-skel"><div class="panel-skel-line w-100"></div><div class="panel-skel-line w-80"></div></div>
        </div>
      </div>

      <!-- ROW 3 -->
      <div class="dash-row-half">
        <!-- 4. Church Status -->
        <div class="dash-panel">
          <div class="dash-panel-header">
            <span class="dash-panel-title" style="color: var(--purple);">
              <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
              Church Vacancy Board
            </span>
            <a href="/church.html" class="btn btn-sm btn-ghost">View All</a>
          </div>
          <div class="dash-panel-body">
            <table class="dash-table">
              <colgroup>
                <col style="width: 35%;">
                <col style="width: 22%;">
                <col style="width: 28%;">
                <col style="width: 15%;">
              </colgroup>
              <thead><tr><th>Church Name</th><th>District</th><th>Assigned Pastor</th><th style="text-align:right">Status</th></tr></thead>
              <tbody id="church-panel"></tbody>
            </table>
          </div>
        </div>

        <!-- 5. Pastor Deployment -->
        <div class="dash-panel">
          <div class="dash-panel-header">
             <span class="dash-panel-title" style="color: var(--green);">
              <svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.87"/></svg>
              Pastor Deployment
             </span>
             <a href="/pastors.html" class="btn btn-sm btn-ghost">View All</a>
          </div>
          <div class="dash-panel-body">
            <table class="dash-table">
              <colgroup>
                <col style="width: 40%;">
                <col style="width: 40%;">
                <col style="width: 20%;">
              </colgroup>
              <thead><tr><th>Pastor</th><th>Church</th><th style="text-align:right">Status</th></tr></thead>
              <tbody id="pastor-panel"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- ROW 4 -->
      <div class="dash-row-3">
        <!-- 6. Conf Live Panel & Scanner -->
        <div class="dash-panel" style="grid-column: span 1;">
          <div class="dash-panel-header">
             <span class="dash-panel-title" style="color:var(--blue);">
              <svg viewBox="0 0 24 24" stroke="currentColor"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="3" y1="12" x2="21" y2="12"/></svg>
              Live Conference Stats
             </span>
             <a href="/scanner.html" class="btn btn-sm btn-primary">Open Scanner</a>
          </div>
          <div class="dash-panel-body padded" id="cal-live-panel">
            <div class="panel-skel"><div class="panel-skel-line w-100"></div></div>
          </div>
        </div>

        <!-- 7. Scan Feed -->
        <div class="dash-panel" style="grid-column: span 1;">
          <div class="dash-panel-header">
             <span class="dash-panel-title" style="color: var(--red);">
              <svg viewBox="0 0 24 24"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
              Live Scan Feed
             </span>
          </div>
          <div class="dash-panel-body" id="scan-panel">
            <div class="panel-skel"><div class="panel-skel-line w-100"></div></div>
          </div>
        </div>

        <!-- 8. Calendar Widget -->
        <div class="dash-panel" style="grid-column: span 1;">
           <div class="dash-panel-header">
             <span class="dash-panel-title" style="color: var(--purple);">
              <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
              Schedule
             </span>
          </div>
          <div class="cal-wrapper" id="calendar-widget">
             <!-- JS populated -->
          </div>
        </div>
      </div>

      <!-- ROW 5 (Optional) -->
      <div class="dash-panel">
        <div class="dash-panel-header">
          <span class="dash-panel-title" style="color: var(--blue);">
            <svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
            Recent User Activity
          </span>
          <a href="/admin_logs.html" class="btn btn-sm btn-ghost">Audit Logs</a>
        </div>
        <div class="dash-panel-body" id="activity-panel">
           <div class="panel-skel"><div class="panel-skel-line w-80"></div></div>
        </div>
      </div>

    </main>
  </div>
</div>

<script src="js/libs/supabase.min.js"></script>
<!-- Page Logic -->
<script type="module" src="js/pages/dashboard.js"></script>
</body>
</html>
