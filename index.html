<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — VCCC DAVAO MS</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="icon" type="image/png" href="assets/VCCC-Logo.png">
</head>
<body>
<div class="app-shell">

  <!-- Sidebar -->
  <aside class="sidebar">
    <a href="/index.html" class="sidebar-logo">
      <img src="assets/VCCC-Logo.png" class="sidebar-logo-img" alt="VCCC Logo" />
    </a>
    <nav class="sidebar-nav">
      <a href="/index.html"             class="nav-item" data-page="dashboard"   data-tip="Dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></a>
      <a href="/pages/pastors.html"     class="nav-item" data-page="pastors"     data-tip="Pastors"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.87"/></svg></a>
      <a href="/pages/disciples.html"   class="nav-item" data-page="disciples"   data-tip="Disciples"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20v-2a8 8 0 0 1 16 0v2"/></svg></a>
      <div class="sidebar-divider"></div>
      <a href="/pages/conferences.html" class="nav-item" data-page="conferences" data-tip="Conferences"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></a>
      <a href="/pages/badges.html"      class="nav-item" data-page="badges"      data-tip="Badges"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg></a>
      <a href="/pages/scanner.html"     class="nav-item" data-page="scanner"     data-tip="Scanner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="3" y1="12" x2="21" y2="12"/></svg></a>
      <a href="/pages/reports.html"     class="nav-item" data-page="reports"     data-tip="Reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg></a>
    </nav>
    <div class="sidebar-bottom">
      <div class="sidebar-divider"></div>
      <!-- User / Admin info can go here -->
    </div>
  </aside>

  <!-- Main -->
  <div class="app-main">
    <header class="topbar">
      <div class="topbar-title">Dashboard</div>
      <div class="topbar-search">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="global-search" placeholder="Search delegates..." />
      </div>
    </header>

    <main class="page-content" id="main-content">
      <!-- Stats -->
      <div class="stats-grid">
        <a href="/pages/pastors.html" class="stat-card">
          <div class="stat-icon si-red"><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg></div>
          <div class="stat-info">
            <div class="stat-val" id="stat-pastors">0</div>
            <div class="stat-label">Total Pastors</div>
          </div>
        </a>
        <a href="/pages/disciples.html" class="stat-card">
          <div class="stat-icon si-green"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 20v-2a8 8 0 0 1 16 0v2"/></svg></div>
          <div class="stat-info">
            <div class="stat-val" id="stat-disciples">0</div>
            <div class="stat-label">Total Disciples</div>
          </div>
        </a>
        <a href="/pages/reports.html" class="stat-card">
          <div class="stat-icon si-blue"><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></div>
          <div class="stat-info">
            <div class="stat-val" id="stat-total">0</div>
            <div class="stat-label">Total Delegates</div>
          </div>
        </a>
        <a href="/pages/reports.html" class="stat-card">
          <div class="stat-icon si-purple"><svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="3" y1="12" x2="21" y2="12"/></svg></div>
          <div class="stat-info">
            <div class="stat-val" id="stat-scans">0</div>
            <div class="stat-label">Total Scans</div>
          </div>
        </a>
        <a href="/pages/conferences.html" class="stat-card">
          <div class="stat-icon si-red"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/></svg></div>
          <div class="stat-info">
            <div class="stat-val" id="stat-confs">0</div>
            <div class="stat-label">Conferences</div>
          </div>
        </a>
      </div>

      <!-- Two col -->
      <div class="two-col">
        <!-- Recent scans -->
        <div class="card">
          <div class="card-head">
            <span class="card-title">Recent scans</span>
            <a href="/pages/reports.html" class="card-link">View all</a>
          </div>
          <div id="recent-scans-list"><div class="skel-row skeleton m-8"></div><div class="skel-row skeleton m-8"></div><div class="skel-row skeleton m-8"></div></div>
        </div>

        <div class="card">
          <div class="card-head">
            <span class="card-title">Attendance by Slot</span>
            <a href="/pages/reports.html" class="card-link">Full report</a>
          </div>
          <div id="meal-bars-list"><div class="skel-row skeleton m-8"></div><div class="skel-row skeleton m-8"></div></div>
        </div>
      </div>

      <!-- Quick actions -->
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <a href="/pages/scanner.html"     class="btn btn-primary"><svg viewBox="0 0 24 24"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="3" y1="12" x2="21" y2="12"/></svg> Open scanner</a>
        <a href="/pages/pastors.html"     class="btn btn-ghost"><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/></svg> Pastors</a>
        <a href="/pages/badges.html"      class="btn btn-ghost"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg> Badges</a>
        <a href="/pages/reports.html"     class="btn btn-ghost"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg> Reports</a>
      </div>
    </main>
  </div>
</div>

<script src="js/libs/supabase.min.js"></script>
<script src="js/supabase.js"></script>
<script src="js/router.js"></script>
<script src="js/utils/helper.js"></script>
<script src="js/services/district.service.js"></script>
<script src="js/services/church.service.js"></script>
<script src="js/services/pastor.service.js"></script>
<script src="js/services/disciple.service.js"></script>
<script src="js/services/conference.service.js"></script>
<script src="js/services/attendance.service.js"></script>
<script src="js/services/scan_log.service.js"></script>
<script src="js/pages/dashboard.js"></script>
</body>
</html>
