<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Churches — VCCC DAVAO MS</title>
  <link rel="stylesheet" href="./css/app.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="components/button/button.css" />
  <link rel="stylesheet" href="components/form/form.css" />
  <link rel="stylesheet" href="components/modal/modal.css" />
  <link rel="stylesheet" href="components/table/table.css" />
  <link rel="stylesheet" href="components/filter-bar/filter-bar.css" />
  <link rel="stylesheet" href="components/search-select/search-select.css" />
  <link rel="stylesheet" href="components/avatar/avatar.css" />
  <link rel="icon" type="image/png" href="./assets/VCCC-Logo.png">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-container"></div>
  <div class="app-main">
    <main class="page-content" id="main-content">
      <div class="page-header">
        <div class="page-header-info">
          <span class="page-header-title">Churches</span>
          <span class="page-header-count" id="church-count"></span>
        </div>
        <div class="page-header-actions">
          <button class="btn btn-ghost" id="btn-export">
            <svg viewBox="0 0 24 24"><polyline points="8 17 12 21 16 17"/><line x1="12" y1="3" x2="12" y2="21"/></svg> Export Data
          </button>
          <button class="btn btn-primary" id="btn-add-church">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add New Church
          </button>
        </div>
      </div>

      <div class="filter-bar">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="church-search" placeholder="Search church name or address..." />
        </div>
        <div id="filter-district" style="width:180px;"></div>
        <div id="filter-scope"    style="width:180px;"></div>
      </div>

      <div class="data-table">
        <div class="data-table-head cols-church">
          <span>Church Name</span>
          <span>Address</span>
          <span>District</span>
          <span>Type</span>
          <span>Current Pastor</span>
          <span style="text-align:right">Actions</span>
        </div>
        <div id="church-table-body" class="data-table-body">
          <div class="skel-row skeleton"></div>
          <div class="skel-row skeleton"></div>
        </div>
        <div id="pagination" style="display:none; justify-content:space-between; align-items:center; padding: 12px 16px; border-top: 1px solid var(--border);">
          <div style="font-size:13px; color:var(--text-3); font-weight:500;" id="page-info"></div>
          <div style="display:flex; gap:6px;">
            <button class="btn btn-ghost" style="height:32px; padding:0 12px; font-size:13px;" id="btn-prev">Prev</button>
            <button class="btn btn-ghost" style="height:32px; padding:0 12px; font-size:13px;" id="btn-next">Next</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- TEMPLATES -->
<template id="church-grid-template">
  <div class="data-table-row cols-church">
    <div class="cell-name-primary" data-label="Name" style="display:flex; align-items:center; gap:10px;">
      <div class="pcm-status-wrap"></div>
      <span class="c-name" style="font-weight:600;"></span>
    </div>
    <div class="c-address" style="font-size:13px; color:var(--text); opacity:0.9;" data-label="Address"></div>
    <div class="c-district" style="font-size:12px; color:var(--text-2); opacity:0.8;" data-label="District"></div>
    <div class="c-type" style="font-size:11px; font-weight:600; text-transform:uppercase;" data-label="Type"></div>
    <div class="c-pastor" style="font-size:13px; font-weight:500;" data-label="Pastor"></div>
    <div class="row-actions"></div>
  </div>
</template>

<template id="church-card-template">
  <div class="pastor-card-mobile pcm-wrap">
    <div class="pcm-header">
      <div class="pcm-status-wrap" style="margin-right:10px;"></div>
      <div class="pcm-title-area">
        <div class="pcm-name"></div>
        <div class="pcm-wife-name pastor-text"></div>
      </div>
    </div>
    <div class="pcm-info-grid">
      <div class="pcm-info-item"><span class="pcm-info-label">District</span><span class="pcm-info-val district-val pcm-info-value"></span></div>
      <div class="pcm-info-item"><span class="pcm-info-label">Address</span><span class="pcm-info-val address-val pcm-info-value"></span></div>
    </div>
    <div class="pcm-actions"></div>
  </div>
</template>

<!-- Church Modal -->
<div class="modal-overlay" id="church-modal-overlay">
  <div class="modal-box">
    <div class="modal-head">
      <span class="modal-title" id="modal-title">Add New Church</span>
      <button class="modal-close" id="btn-close-modal">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <form id="church-form">
      <div class="modal-body">
        <input type="hidden" name="id" id="f-id" />
        <div class="form-field">
          <label class="form-label">Church Name <span class="req">*</span></label>
          <input class="input" name="church_name" type="text" id="f-name" placeholder="e.g. DAVAO" required />
        </div>
        <div class="form-field">
          <label class="form-label">Address <span class="req">*</span></label>
          <textarea class="input" name="address" id="f-address" style="height:80px; padding-top:10px; resize:none;" placeholder="Complete street address..." required></textarea>
        </div>
        <div class="form-row-2">
          <div class="form-field">
            <label class="form-label">District <span class="opt">(Optional)</span></label>
            <div id="f-district"></div>
          </div>
          <div class="form-field">
            <label class="form-label">Pioneer Pastor <span class="opt">(Optional)</span></label>
            <div id="f-pioneer"></div>
          </div>
        </div>
        <div class="form-field">
          <label class="form-label">Mother Church <span class="opt">(Optional)</span></label>
          <div id="f-mother"></div>
        </div>
        <div class="form-field">
          <label class="form-label">Location Type</label>
          <div style="display:flex; gap:20px; align-items:center; padding:10px 0;">
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:14px;"><input type="radio" name="church_scope" value="local" checked /> Local</label>
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:14px;"><input type="radio" name="church_scope" value="international" /> International</label>
          </div>
        </div>
        <div class="form-field">
          <label class="form-label">Notes <span class="opt">(Optional)</span></label>
          <textarea class="input" name="notes" id="f-notes" style="height:80px; padding-top:10px; resize:none;" placeholder="Any additional details..."></textarea>
        </div>
      </div>
      <div class="modal-foot">
        <button class="btn btn-ghost" type="button" id="btn-cancel-modal">Cancel</button>
        <button class="btn btn-primary" type="submit" id="btn-save-church">Save Church</button>
      </div>
    </form>
  </div>
</div>

  <!-- Details Modal (New) -->
  <div class="modal-overlay" id="church-details-overlay">
    <div class="modal-box" style="max-width:800px;">
      <div class="modal-head">
        <span class="modal-title" id="details-title">Church Overview</span>
        <button type="button" class="modal-close" id="btn-close-det">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="modal-body" id="church-details-body">
        <!-- Dynamic content from view.js -->
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" style="width:100%;" id="btn-cancel-det" onclick="document.getElementById('church-details-overlay').classList.remove('open')">Close Overview</button>
      </div>
    </div>
  </div>

  <!-- Add Historical Record Modal -->
<div class="modal-overlay" id="modal-historical">
  <div class="modal-box" style="max-width: 500px;">
    <div class="modal-head">
      <div class="modal-title" id="hist-modal-title">Add Historical Assignment</div>
      <button class="modal-close" type="button" id="btn-close-hist">&times;</button>
    </div>
    <div class="modal-body">
      <div style="margin-bottom:16px; padding:10px; background:var(--bg-card); border-radius:8px; border:1px solid var(--border); font-size:13px;">
        <span style="color:var(--text-3);">Church:</span> <span id="hist-church-name" style="font-weight:700; color:var(--brand-main);"></span>
      </div>
      <form id="form-historical" style="display:flex; flex-direction:column; gap:16px;">
        <input type="hidden" id="hist-church-id" />
        <div class="form-field">
          <label class="form-label">Pastor</label>
          <div id="f-hist-pastor"></div>
        </div>
        <div class="form-row-2">
          <div class="form-field">
            <label class="form-label">Start Date</label>
            <input type="date" id="hist-start" class="input" required />
          </div>
          <div class="form-field">
            <label class="form-label">End Date</label>
            <input type="date" id="hist-end" class="input" required />
          </div>
        </div>
        <div class="form-row-2">
          <div class="form-field">
            <label class="form-label">Role</label>
            <select id="hist-role" class="select-input" required>
              <option value="Lead Pastor">Lead Pastor</option>
              <option value="Assistant Pastor">Assistant Pastor</option>
              <option value="District Presbyter">District Presbyter</option>
              <option value="Interim Setup">Interim Setup</option>
            </select>
          </div>
          <div class="form-field">
            <label class="form-label">Event Type</label>
            <select id="hist-event" class="select-input" required>
              <option value="Legacy Assignment" selected>Legacy Assignment</option>
              <option value="Transfer">Transfer</option>
              <option value="Pioneering">Pioneering</option>
              <option value="Takeover">Takeover</option>
            </select>
          </div>
        </div>
        <div class="form-field">
          <label class="form-label">Notes / Source</label>
          <textarea id="hist-notes" class="input" style="height:auto; padding:10px 14px;" rows="2" placeholder="e.g. Added from physical ledger"></textarea>
        </div>
        <div class="modal-foot" style="margin-top:8px; padding:0; border:none;">
          <button type="button" class="btn btn-ghost" id="btn-cancel-hist">Cancel</button>
          <button type="submit" class="btn btn-primary" id="btn-submit-historical">Save Record</button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- Export Choice Modal -->
<div class="modal-overlay" id="export-modal-overlay">
  <div class="modal-box modal-sm" style="max-width:400px;">
    <div class="modal-head">
      <span class="modal-title">Export Church List</span>
      <button class="modal-close" id="btn-close-export"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="modal-body">
      <div style="display:flex; flex-direction:column; gap:12px; padding:8px 0;">
        <button class="btn btn-ghost" id="btn-export-all" style="justify-content:flex-start; height:52px; font-weight:600; border:1px solid var(--border); padding:0 20px;"><span style="font-size:16px; margin-right:16px; color:var(--text-3);">1.</span> ALL CHURCH (A to Z)</button>
        <button class="btn btn-ghost" id="btn-export-info" style="justify-content:flex-start; height:52px; font-weight:600; border:1px solid var(--border); padding:0 20px;"><span style="font-size:16px; margin-right:16px; color:var(--text-3);">2.</span> CHURCH INFO (By District Sheets)</button>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-ghost" id="btn-cancel-export" style="width:100%;">Cancel</button>
    </div>
  </div>
</div>

<script src="./js/libs/supabase.min.js"></script>
<script type="module" src="./js/pages/churches/churches.controller.js"></script>
</body>
</html>
