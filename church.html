<body>

  <aside class="sidebar">
    <a href="/" class="sidebar-logo">

      <a href="/pastors.html"     class="nav-item" data-page="pastors"     data-tip="Pastors"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.87"/></svg></a>
      <a href="/disciples.html"   class="nav-item" data-page="disciples"   data-tip="Disciples"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20v-2a8 8 0 0 1 16 0v2"/></svg></a>
      <!-- Church Org -->

      <a href="/assignment.html"  class="nav-item" data-page="assignment"  data-tip="Assignment"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/><polyline points="9 9 9 9"/></svg></a>
      <a href="/district.html"    class="nav-item" data-page="district"    data-tip="District"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></a>
      <!-- Events -->
      <div class="sidebar-divider"></div>
      <a href="/conferences.html" class="nav-item" data-page="conferences" data-tip="Conferences"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></a>

      <div class="sidebar-divider"></div>
      <button class="nav-item" id="btn-logout" data-tip="Sign Out" style="cursor:pointer;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>

  <div class="app-main">
    <header class="topbar"><div class="topbar-title">Church</div></header>
    <main class="page-content">
      <!-- Header -->
      <div class="page-header">
        <div class="page-header-info">
          <h1 class="page-header-title">Church</h1>
          <span class="page-header-count" id="church-count">0 total</span>
        </div>
        <div class="page-header-actions">
          <button class="btn btn-primary" id="btn-add-church">
            <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Add New Church
          </button>
        </div>
      </div>

      <!-- Filter/Search Bar -->
      <div class="filter-bar">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="church-search" placeholder="Search church name or address..." />
        </div>
        <div id="filter-district" style="width:180px;"></div>
        <div id="filter-scope"    style="width:180px;"></div>
      </div>

      <!-- Data Table -->
      <div class="data-table">
        <div class="data-table-head cols-church">
          <div>Church Name</div>
          <div>Address</div>
          <div>District</div>
          <div>Type</div>
          <div>Current Pastor</div>
          <div style="text-align:right">Actions</div>
        </div>
        <div id="church-list" class="data-table-body">
          <!-- Rows will be injected by church.js -->
          <div class="empty-state">
            <div class="skeleton skel-row" style="width:100%"></div>
            <div class="skeleton skel-row" style="width:100%"></div>
            <div class="skeleton skel-row" style="width:100%"></div>
          </div>
        </div>
        <div id="pagination" style="display:none; justify-content:space-between; align-items:center; padding: 12px 16px; border-top: 1px solid var(--border);">
          <div style="font-size:13px; color:var(--text-3); font-weight:500;" id="page-info"></div>
          <div style="display:flex; gap:6px;">
            <button class="btn btn-ghost" style="height:32px; padding:0 12px; font-size:13px;" id="btn-prev">Prev</button>
            <button class="btn btn-ghost" style="height:32px; padding:0 12px; font-size:13px;" id="btn-next">Next</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- TEMPLATES FOR SAFE DOM RENDERING -->
<template id="church-card-template">
  <div class="pastor-card-mobile pcm-wrap">
    <div class="pcm-header">
      <div class="pcm-status-wrap" style="margin-right:10px;"></div>
      <div class="pcm-title-area">
        <div class="pcm-name"></div>
        <div class="pcm-wife-name pastor-text"></div>
      </div>
    </div>
    <div class="pcm-info-grid">
      <div class="pcm-info-item"><span class="pcm-info-label">District</span><span class="pcm-info-val district-val pcm-info-value"></span></div>
      <div class="pcm-info-item"><span class="pcm-info-label">Address</span><span class="pcm-info-val address-val pcm-info-value"></span></div>
    </div>
    <div class="pcm-actions"></div>
  </div>
</template>

<!-- Church Modal -->
<div class="modal-overlay" id="church-modal-overlay">
  <div class="modal-box">
    <div class="modal-head">
      <h2 class="modal-title" id="modal-title">Add New Church</h2>
      <button class="modal-close" id="btn-close-modal">&times;</button>
    </div>
    <form id="church-form">
      <div class="modal-body">
        <input type="hidden" id="church-id" />
        
        <div class="form-field">
          <label class="form-label">Church Name <span class="req">*</span></label>
          <input type="text" id="f-name" class="input" placeholder="e.g. DAVAO" required />
        </div>

        <div class="form-field">
          <label class="form-label">Address <span class="req">*</span></label>
          <textarea id="f-address" class="input" style="height:80px; padding-top:10px; resize:none;" placeholder="Complete street address..." required></textarea>
        </div>

        <div class="form-field">
          <label class="form-label">District <span class="opt">(Optional)</span></label>
          <select id="f-district" class="input">
            <option value="">-- Select District --</option>
          </select>
        </div>

        <div class="form-field">
          <label class="form-label">Location Type</label>
          <div style="display:flex; gap:20px; align-items:center; padding:10px 0;">
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:14px;">
              <input type="radio" name="f-type" value="local" checked /> Local
            </label>
            <label style="display:flex; align-items:center; gap:8px; cursor:pointer; font-size:14px;">
              <input type="radio" name="f-type" value="international" /> International
            </label>
          </div>
        </div>

        <div class="form-field">
          <label class="form-label">Notes <span class="opt">(Optional)</span></label>
          <textarea id="f-notes" class="input" style="height:80px; padding-top:10px; resize:none;" placeholder="Any additional details..."></textarea>
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" id="btn-cancel-modal">Cancel</button>
        <button type="submit" class="btn btn-primary" id="btn-save-church">Save Church</button>
      </div>
    </form>
  </div>
</div>

<!-- Quick Add Disciple Modal -->
<div class="modal-overlay" id="quick-disciple-overlay">
  <div class="modal-box modal-sm">
    <div class="modal-head">
      <h2 class="modal-title">Quick Add Disciple</h2>
      <button class="modal-close" id="btn-close-qd">&times;</button>
    </div>
    <form id="quick-disciple-form">
      <div class="modal-body">
        <input type="hidden" id="qd-church-id" />
        <div style="font-size:12px; color:var(--text-3); margin-bottom:12px;">
          Church: <span id="qd-church-name" style="color:var(--text); font-weight:600;"></span>
        </div>
        <div class="form-field">
          <label class="form-label">Disciple Name <span class="req">*</span></label>
          <input type="text" id="qd-name" class="input" placeholder="FULL NAME" required />
        </div>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-ghost" id="btn-cancel-qd">Cancel</button>
        <button type="submit" class="btn btn-primary">Add Disciple</button>
      </div>
    </form>
  </div>
</div>

<style>
  /* Page specific grid columns */
  .cols-church { 
    grid-template-columns: 1.2fr 1.2fr 1fr 0.8fr 1.2fr 160px; 
    gap: 12px;
  }
  
  /* Mobile styling for the 320px requirement */
  @media (max-width: 768px) {
    .cols-church { 
      grid-template-columns: 1fr; 
    }
  }
</style>
  </div>
</div>

<script src="./js/libs/supabase.min.js"></script>
<script type="module" src="./js/pages/church.js"></script>
