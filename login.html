<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — VCCC DAVAO MS</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="icon" type="image/png" href="assets/VCCC-Logo.png">
  <style>
    body { background: var(--bg-body); display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .login-box { width: 100%; max-width: 380px; background: var(--bg-card); border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow-md); overflow: hidden; }
    .login-head { padding: 32px 24px 24px; text-align: center; }
    .login-logo { width: 64px; height: 64px; margin-bottom: 16px; border-radius: 12px; }
    .login-title { font-size: 20px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .login-desc { font-size: 13px; color: var(--text-3); }
    .login-body { padding: 0 24px 32px; display: flex; flex-direction: column; gap: 16px; }
  </style>
</head>
<body>
  <div class="login-box">
    <div class="login-head">
      <img src="assets/VCCC-Logo.png" alt="VCCC Logo" class="login-logo" />
      <div class="login-title">Welcome back</div>
      <div class="login-desc">Sign in to VCCC Delegate System</div>
    </div>
    <div class="login-body" id="login-form">
      <div class="form-field">
        <label class="form-label">Email Address</label>
        <input type="email" id="login-email" class="input" placeholder="Enter email address" />
      </div>
      <div class="form-field">
        <label class="form-label">Password</label>
        <div class="password-wrap">
          <input type="password" id="login-password" class="input" placeholder="Enter password" />
          <button type="button" class="password-toggle" id="toggle-password" title="Show password">
            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
            <svg class="eye" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </button>
        </div>
      </div>
      <div id="login-error" class="form-error" style="display: none; text-align: center; font-size: 13px;"></div>
      <button class="btn btn-primary" id="btn-login" style="margin-top: 8px; height: 40px; font-size: 14px;">Sign In</button>
    </div>
  </div>

  <script src="js/libs/supabase.min.js"></script>
  <script type="module" src="js/pages/login.js"></script>
</body>
</html>
