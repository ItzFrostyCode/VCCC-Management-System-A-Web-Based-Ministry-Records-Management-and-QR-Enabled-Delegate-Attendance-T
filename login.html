<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — VCCC Management System</title>
    <!-- Core Design System -->
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/ui.css" />
    <link rel="stylesheet" href="components/button/button.css" />
    <link rel="stylesheet" href="components/form/form.css" />
    <!-- Page Specific -->
    <link rel="stylesheet" href="css/pages/login.css" />
    <link rel="icon" type="image/png" href="assets/VCCC-Logo.png">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img src="assets/VCCC-Logo.png" alt="VCCC Logo" class="login-logo" />
                <h1 class="login-title">Welcome Back</h1>
                <p class="login-subtitle">Sign in to the VCCC Management System</p>
            </div>

            <div class="login-form">
                <div class="form-field">
                    <label class="form-label">Email Address</label>
                    <input type="email" id="login-email" class="input" placeholder="name@vccc.com" required />
                </div>

                <div class="form-field">
                    <label class="form-label">Password</label>
                    <div class="password-input-group">
                        <input type="password" id="login-password" class="input" placeholder="••••••••" required />
                        <button type="button" class="password-toggle" id="toggle-password" title="Show password">
                            <svg class="eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                            <svg class="eye" style="display: none;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <div id="login-error" class="login-error-box" style="display: none;"></div>

                <button class="btn btn-primary login-submit-btn" id="btn-login">Sign In</button>
            </div>

            <div class="login-footer">
                <p>&copy; 2024 VCCC Davao Metro South. All rights reserved.</p>
            </div>
        </div>
    </div>

    <!-- Initialization Script -->
    <script src="js/libs/supabase.min.js"></script>
    <script type="module" src="js/pages/login.controller.js"></script>
</body>
</html>
