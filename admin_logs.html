<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activity Logs — VCCC DAVAO MS</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" /> <!-- Keeping original index -->
  <link rel="stylesheet" href="components/button/button.css" />
  <link rel="stylesheet" href="components/form/form.css" />
  <link rel="stylesheet" href="components/modal/modal.css" />
  <link rel="stylesheet" href="components/table/table.css" />
  <link rel="stylesheet" href="components/filter-bar/filter-bar.css" />
  <link rel="stylesheet" href="components/search-select/search-select.css" />
  <link rel="stylesheet" href="components/avatar/avatar.css" />
  <link rel="stylesheet" href="components/stats/stats.css" />
  <link rel="stylesheet" href="components/tabs/tabs.css" />
  <link rel="stylesheet" href="components/badge/badge.css" />
  <link rel="stylesheet" href="components/history/history.css" />
  <link rel="stylesheet" href="components/password/password.css" />
  <link rel="stylesheet" href="css/pages/admin_logs.css" />
  <link rel="icon" type="image/png" href="assets/VCCC-Logo.png">
</head>
<body><div class="app-shell">
  <!-- Sidebar and Topbar injected here by layout.js -->
  <div class="app-main">
    <main class="page-content" id="main-content">

      <div class="page-header">
        <div class="page-header-info">
          <h1 class="page-header-title">System Activity</h1>
          <span class="page-header-count" id="count-label">0 logs</span>
        </div>
        <div class="page-header-actions">
           <button class="btn btn-secondary btn-sm" id="btn-export-logs">
             <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:4px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
             Export Excel
           </button>
           <button class="btn btn-secondary btn-sm" id="btn-refresh">Refresh</button>
        </div>
      </div>

      <div class="card">
        <div class="card-body">
          <div class="data-table" style="margin-bottom: 0;">
            <div class="data-table-head cols-logs">
              <div>Timestamp</div>
              <div>User</div>
              <div>Action</div>
              <div>Details</div>
              <div class="col-device">Device</div>
            </div>
            <div id="table-body">
              <div class="empty-state">Loading logs...</div>
            </div>
          </div>
          
          <!-- Pagination inside card-body -->
          <div class="pagination" id="pagination" style="display: none; border-top: 1px solid var(--border);">
            <button class="btn btn-secondary btn-sm" id="btn-prev">Previous</button>
            <span id="page-info" style="font-size: 13px; color: var(--text-3);"></span>
            <button class="btn btn-secondary btn-sm" id="btn-next">Next</button>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="js/libs/supabase.min.js"></script>
<script type="module" src="js/pages/admin-logs.controller.js"></script>
</body>
</html>
