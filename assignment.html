<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Assignment — VCCC DAVAO MS</title>
  <link rel="stylesheet" href="./css/app.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="css/components.css" /> <!-- Keeping original index -->
  <link rel="stylesheet" href="components/button/button.css" />
  <link rel="stylesheet" href="components/form/form.css" />
  <link rel="stylesheet" href="components/modal/modal.css" />
  <link rel="stylesheet" href="components/table/table.css" />
  <link rel="stylesheet" href="components/filter-bar/filter-bar.css" />
  <link rel="stylesheet" href="components/search-select/search-select.css" />
  <link rel="stylesheet" href="components/avatar/avatar.css" />
  <link rel="stylesheet" href="components/stats/stats.css" />
  <link rel="stylesheet" href="components/tabs/tabs.css" />
  <link rel="stylesheet" href="components/badge/badge.css" />
  <link rel="stylesheet" href="components/history/history.css" />
  <link rel="stylesheet" href="components/password/password.css" />
  <link rel="icon" type="image/png" href="./assets/VCCC-Logo.png">
  <link rel="stylesheet" href="css/pages/assignment.css" />
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
<div class="app-shell">
  <div id="sidebar-container"></div>
  <div class="app-main">
    <main class="page-content" id="main-content">
      <!-- Header -->
      <div class="page-header">
        <div class="page-header-info">
          <h1 class="page-header-title">Assignment Records</h1>
          <span class="page-header-count" id="assignment-count">0 total records</span>
        </div>
        <div class="page-header-actions">
          <button class="btn btn-ghost" id="btn-export">
            <svg viewBox="0 0 24 24"><polyline points="8 17 12 21 16 17"/><line x1="12" y1="3" x2="12" y2="21"/></svg>
            Export Data
          </button>
          <button class="btn btn-primary" id="btn-add-assignment">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            Add Record
          </button>
        </div>
      </div>

      <!-- Filters -->
        <div class="filter-bar">
          <div class="search-wrap">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="assign-search" placeholder="Search pastor or church..." />
          </div>
          <div id="filter-type"   style="width:180px;"></div>
          <div id="filter-status" style="width:180px;"></div>
        </div>

      <!-- Data Table -->
      <div class="data-table">
        <div class="data-table-head cols-assign">
          <div>Pastor / Church</div>
          <div>Role (Event)</div>
          <div>Status</div>
          <div>Duration</div>
          <div style="text-align:right">Actions</div>
        </div>
        <div id="assignment-table-body" class="data-table-body">
          <div class="empty-state">
            <div class="skeleton skel-row" style="width:100%"></div>
            <div class="skeleton skel-row" style="width:100%"></div>
          </div>
        </div>
      </div>
        <div id="pagination" style="display:none; justify-content:space-between; align-items:center; padding: 12px 16px; border-top: 1px solid var(--border);">
          <div style="font-size:13px; color:var(--text-3); font-weight:500;" id="page-info">Showing 1-10 of 0</div>
          <div style="display:flex; gap:6px;">
            <button class="btn btn-ghost" style="height:32px; padding:0 12px; font-size:13px;" id="btn-prev">Prev</button>
            <button class="btn btn-ghost" style="height:32px; padding:0 12px; font-size:13px;" id="btn-next">Next</button>
          </div>
        </div>
      </div>
    </main>
    
    <!-- TEMPLATES FOR SAFE DOM RENDERING -->
    <template id="assignment-card-template">
      <div class="pastor-card-mobile pcm-wrap">
        <div class="pcm-header">
          <div class="pcm-avatars">
            <div class="pcm-avatar-wrap pcm-avatar-pastor"></div>
          </div>
          <div class="pcm-title-area">
            <div class="pcm-name"></div>
            <div class="pcm-wife-name"></div>
          </div>
          <div class="pcm-status-wrap"></div>
        </div>
        <div class="pcm-info-grid">
          <div class="pcm-info-item"><span class="pcm-info-label">Role</span><span class="pcm-info-val role-text"></span></div>
          <div class="pcm-info-item"><span class="pcm-info-label">Event</span><span class="pcm-info-val event-text"></span></div>
          <div class="pcm-info-item"><span class="pcm-info-label">Start Date</span><span class="pcm-info-val start-val"></span></div>
          <div class="pcm-info-item"><span class="pcm-info-label">End Date</span><span class="pcm-info-val end-val"></span></div>
        </div>
        <div class="pcm-actions">
          <!-- Actions added via JS -->
        </div>
      </div>
    </template>

    <!-- Edit / Add Modal (Correction) -->
    <div class="modal-overlay" id="modal-edit">
      <div class="modal-box">
        <div class="modal-head">
          <h2 class="modal-title" id="modal-title-edit">Assignment Record</h2>
          <button class="modal-close" id="btn-close-edit">&times;</button>
        </div>
        <form id="assignment-form-edit">
          <div class="modal-body">
            <input type="hidden" id="fe-id" name="id" />
            
            <div class="form-row-2">
              <div class="form-field">
                <label class="form-label">Pastor <span class="req">*</span></label>
                <div id="fe-pastor-sel"></div>
              </div>
              <div class="form-field">
                <label class="form-label">Church <span class="req">*</span></label>
                <div id="fe-church-sel"></div>
              </div>
            </div>

            <div class="form-row-2">
              <div class="form-field">
                <label class="form-label">Assignment Type <span class="req">*</span></label>
                <select id="fe-assignment-type" name="assignment_type" class="input" required>
                  <option value="takeover">Takeover — Assuming an existing pastorate</option>
                  <option value="pioneering">Pioneering — Starting a new church</option>
                  <option value="legacy">Legacy — Imported historical record</option>
                </select>
              </div>
              <div class="form-field">
                <label class="form-label">Start Date <span class="req">*</span></label>
                <input type="date" id="fe-start" name="start_date" class="input" required />
              </div>
            </div>

            <div class="form-field">
              <label class="form-label">Notes</label>
              <textarea id="fe-notes" name="notes" class="input" style="height:60px; padding-top:10px; resize:none;" placeholder="Background context for this assignment..."></textarea>
            </div>
          </div>
          <div class="modal-foot">
            <button type="button" class="btn btn-ghost" id="btn-cancel-edit">Cancel</button>
            <button type="submit" class="btn btn-primary" id="btn-save-edit">Save Changes</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Update Modal (Lifecycle Progression) -->
    <div class="modal-overlay" id="modal-update">
      <div class="modal-box modal-sm">
        <div class="modal-head">
          <h2 class="modal-title">Update Status</h2>
          <button class="modal-close" id="btn-close-update">&times;</button>
        </div>
        <form id="assignment-form-update">
          <div class="modal-body">
            <input type="hidden" id="fu-id" name="id" />
            
            <div id="fu-context-info" style="margin-bottom:16px; padding:10px 14px; background:var(--bg-input); border:1.5px solid var(--border); border-radius:10px; font-size:13px; font-weight:600; color:var(--text);">
              Loading...
            </div>

            <div class="form-field">
              <label class="form-label">New Status <span class="req">*</span></label>
              <!-- Hidden or read-only status since it's forced to ended when updating? Let's just lock it to ended for clarity -->
              <div style="font-weight:700; color:var(--text); padding:10px; background:#f1f5f9; border-radius:8px; border:1px solid #cbd5e1;">
                ⬛ Ended
              </div>
              <input type="hidden" name="status_code" value="ended" />
            </div>

            <div class="form-field">
              <label class="form-label">End Date <span class="req">*</span></label>
              <input type="date" id="fu-end" name="end_date" class="input" required />
            </div>

            <div class="form-field">
              <label class="form-label">End Reason <span class="req">*</span></label>
              <select id="fu-end-reason" name="end_reason" class="input" required>
                <option value="">-- Select Reason --</option>
                <option value="transferred">Transferred</option>
                <option value="pullout">Pullout</option>
                <option value="redirection">Redirection</option>
                <option value="ended">Ended</option>
                <option value="deceased">Deceased</option>
              </select>
            </div>

            <div class="form-field">
              <label class="form-label">Closing Notes</label>
              <textarea id="fu-notes" name="notes" class="input" style="height:60px; padding-top:10px; resize:none;" placeholder="Optional context..."></textarea>
            </div>
          </div>
          <div class="modal-foot">
            <button type="button" class="btn btn-ghost" id="btn-cancel-update">Cancel</button>
            <button type="submit" class="btn btn-warning" id="btn-save-update">Close Assignment</button>
          </div>
        </form>
      </div>
    </div>


  </div>
</div>

<script src="./js/libs/supabase.min.js"></script>
<script type="module" src="./js/pages/assignments/assignments.controller.js?v=3"></script>
</body>
</html>
