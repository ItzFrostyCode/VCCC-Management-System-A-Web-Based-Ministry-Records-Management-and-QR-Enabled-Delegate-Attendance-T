<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reports — VCCC DAVAO MS</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="icon" type="image/png" href="assets/VCCC-Logo.png">
  <style>
    /* ── Avatar colors ── */
    .l-avatar { width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; flex-shrink:0; }
    .la-p { background:var(--red-light);  color:var(--red-dark); }
    .la-w { background:var(--blue-bg);    color:var(--blue); }
    .la-d { background:var(--green-bg);   color:var(--green); }

    /* ── Role filter chips ── */
    .role-chip { display:inline-flex; align-items:center; gap:5px; padding:5px 14px; border-radius:20px; border:1px solid var(--border); background:var(--bg-input); font-size:12px; font-weight:600; color:var(--text-2); cursor:pointer; transition:all .15s; white-space:nowrap; }
    .role-chip:hover { border-color:var(--red); color:var(--red); background:var(--red-light); }
    .role-chip.active { background:var(--red-light); border-color:var(--red); color:var(--red-dark); }
    .role-chip .chip-count { background:rgba(0,0,0,0.08); color:inherit; border-radius:10px; padding:1px 6px; font-size:11px; }
    .role-chip.active .chip-count { background:rgba(185,28,28,0.12); }

    /* ── Delegate table rows ── */
    .report-tr { border-bottom:1px solid var(--border); transition:background .15s; }
    .report-tr:last-child { border:none; }
    .report-tr:hover { background:#fafafa; }
    .report-td { padding:13px 16px; vertical-align:middle; }

    /* ── Spinning loader ── */
    @keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
    .spinning svg { animation:spin 1s linear infinite; }

    /* ── Empty state for reports ── */
    .report-empty-state { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 24px; gap:12px; text-align:center; }
    .report-empty-icon { width:52px; height:52px; border-radius:16px; background:var(--bg-input); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; margin-bottom:4px; }
    .report-empty-icon svg { width:24px; height:24px; stroke:var(--text-3); fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
    .report-empty-title { font-size:15px; font-weight:600; color:var(--text-2); }
    .report-empty-desc  { font-size:13px; color:var(--text-3); max-width:260px; line-height:1.5; }

    /* ── Stat cards layout ── */
    .report-stats { display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:14px; }

    /* ── Table toolbar ── */
    .table-toolbar { display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--border); flex-wrap:wrap; }
    .table-toolbar-title { font-size:14px; font-weight:700; color:var(--text); flex:1; min-width:120px; }
    @media (max-width:600px) { .table-toolbar { flex-direction:column; align-items:stretch; } .table-toolbar-title { flex:none; } }
  </style>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a href="/" class="sidebar-logo">
      <img src="assets/VCCC-Logo.png" class="sidebar-logo-img" alt="VCCC Logo" />
    </a>
    <nav class="sidebar-nav">
      <!-- People -->
      <a href="/index.html"       class="nav-item" data-page="dashboard"   data-tip="Dashboard"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></a>
      <a href="/pastors.html"     class="nav-item" data-page="pastors"     data-tip="Pastors"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.87"/></svg></a>
      <a href="/disciples.html"   class="nav-item" data-page="disciples"   data-tip="Disciples"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20v-2a8 8 0 0 1 16 0v2"/></svg></a>
      <!-- Church Org -->
      <div class="sidebar-divider"></div>
      <a href="/church.html"      class="nav-item" data-page="church"      data-tip="Church"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></a>
      <a href="/district.html"    class="nav-item" data-page="district"    data-tip="District"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></a>
      <a href="/assignment.html"  class="nav-item" data-page="assignment"  data-tip="Assignment"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="15" y2="17"/><polyline points="9 9 9 9"/></svg></a>
      <!-- Events -->
      <div class="sidebar-divider"></div>
      <a href="/conferences.html" class="nav-item" data-page="conferences" data-tip="Conferences"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></a>
      <a href="/badges.html"      class="nav-item" data-page="badges"      data-tip="Badges"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg></a>
      <a href="/scanner.html"     class="nav-item" data-page="scanner"     data-tip="Scanner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="3" y1="12" x2="21" y2="12"/></svg></a>
      <!-- Data -->
      <div class="sidebar-divider"></div>
      <a href="/reports.html"     class="nav-item active" data-page="reports" data-tip="Reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg></a>
      <a href="/admin_logs.html"  class="nav-item admin-only" data-page="logs" data-tip="Activity Logs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></a>
    </nav>
    <div class="sidebar-bottom">
      <div class="sidebar-divider"></div>
      <button class="nav-item" id="btn-logout" data-tip="Sign Out" onclick="if(typeof authService !== 'undefined') authService.signOut().then(() => window.location.href='/login.html')" style="cursor:pointer;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>
  <div class="app-main">
    <header class="topbar"><div class="topbar-title">Global Reports</div></header>
    <main class="page-content">

      <!-- Page Header -->
      <div class="page-header">
        <div class="page-header-info" style="flex-direction:column; align-items:flex-start; gap:2px;">
          <span class="page-header-title">Global Reports</span>
          <span id="last-updated" style="font-size:11px; color:var(--text-3); font-weight:500;"></span>
        </div>
        <div class="page-header-actions">
          <button class="btn btn-ghost" id="btn-refresh" onclick="refreshReport()" style="display:none; width:38px; padding:0;">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
          </button>
          <button class="btn btn-primary" onclick="exportToExcel()" id="btn-export" style="display:none;">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
            Export
          </button>
        </div>
      </div>

      <!-- Conference Selector -->
      <div class="card" style="padding:16px 20px; overflow:visible;">
        <div class="form-field">
          <label class="form-label">Conference</label>
          <div id="conf-select-container" style="max-width:520px; width:100%;"></div>
        </div>
      </div>

      <!-- Empty Prompt -->
      <div id="empty-prompt" class="card">
        <div class="report-empty-state">
          <div class="report-empty-icon">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
          </div>
          <div class="report-empty-title">No Conference Selected</div>
          <div class="report-empty-desc">Select a conference above to generate the global attendance report.</div>
        </div>
      </div>

      <!-- Results Dashboard (hidden by default) -->
      <div id="results-section" style="display:none; flex-direction:column; gap:16px;">

        <!-- Summary Stat Cards -->
        <div class="report-stats" id="summary-cards">
          <!-- Populated via JS -->
        </div>

        <!-- Delegate Table Card -->
        <div class="card">

          <!-- Toolbar: Title + Search -->
          <div class="table-toolbar">
            <div class="table-toolbar-title">Delegate Status</div>
            <div class="search-wrap" style="max-width:280px; height:38px;">
              <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              <input type="text" id="log-search" placeholder="Search delegates..." oninput="renderGlobalList()" autocomplete="off" />
            </div>
          </div>

          <!-- Role Filter Chips -->
          <div style="display:flex; gap:8px; flex-wrap:wrap; padding:10px 16px; border-bottom:1px solid var(--border); background:var(--bg-input);">
            <button class="role-chip active" id="chip-all"       onclick="filterByRole('ALL')"     >All <span class="chip-count" id="count-all">0</span></button>
            <button class="role-chip"        id="chip-pastor"    onclick="filterByRole('PASTOR')"  >Pastors <span class="chip-count" id="count-pastor">0</span></button>
            <button class="role-chip"        id="chip-wife"      onclick="filterByRole('WIFE')"    >Wives <span class="chip-count" id="count-wife">0</span></button>
            <button class="role-chip"        id="chip-disciple"  onclick="filterByRole('DISCIPLE')">Disciples <span class="chip-count" id="count-disciple">0</span></button>
          </div>

          <!-- Table -->
          <div style="overflow-x:auto; -webkit-overflow-scrolling:touch;">
            <table style="width:100%; border-collapse:collapse; text-align:left;">
              <thead>
                <tr style="background:var(--bg-input);">
                  <th style="padding:11px 16px; font-size:11px; font-weight:700; color:var(--text-3); text-transform:uppercase; letter-spacing:.05em; border-bottom:1px solid var(--border);">Delegate</th>
                  <th style="padding:11px 16px; font-size:11px; font-weight:700; color:var(--text-3); text-transform:uppercase; letter-spacing:.05em; border-bottom:1px solid var(--border);">Church / District</th>
                  <th style="padding:11px 16px; font-size:11px; font-weight:700; color:var(--text-3); text-transform:uppercase; letter-spacing:.05em; border-bottom:1px solid var(--border);">Status</th>
                </tr>
              </thead>
              <tbody id="global-list-body">
                <!-- Populated via JS -->
              </tbody>
            </table>
          </div>

        </div>
      </div>

    </main>
  </div>
</div>

<script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
<script src="js/libs/supabase.min.js"></script>
<script src="js/services/auth.service.js"></script>
<script src="js/supabase.js"></script>
<script src="js/router.js"></script>
<script src="js/utils/helper.js"></script>
<script src="js/utils/formatters.js"></script>
<script src="js/utils/export.js"></script>
<script src="js/services/pastor.service.js"></script>
<script src="js/services/disciple.service.js"></script>
<script src="js/services/conference.service.js"></script>
<script src="js/services/attendance.service.js"></script>
<script src="js/services/meal.service.js"></script>
<script src="js/services/scan_log.service.js"></script>
<script src="js/pages/reports.js"></script>
</body>
</html>
