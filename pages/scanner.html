<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>QR Attendance — VCCC DAVAO MS</title>
  <link rel="stylesheet" href="../css/app.css" />
  <link rel="stylesheet" href="../css/scanner.css" />
  <link rel="icon" type="image/png" href="../assets/VCCC-Logo.png">
</head>
<body>

<!-- ═══ TOP HEADER ═══ -->
<header class="scan-header">
  <button class="mob-hamburger" id="mob-hamburger" onclick="toggleMobileNav()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <a href="/index.html" class="scan-back">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    Dashboard
  </a>
  <div class="scan-header-title">
    <span id="active-conf-name">CONFERENCE QR ATTENDANCE</span>
  </div>
  <div class="scan-header-right">
    <div class="scan-clock" id="live-clock">--:-- --</div>
    <button class="test-mode-btn" id="test-mode-btn" title="Toggle Test Mode" onclick="toggleTestMode()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
      Test Mode
    </button>
    <button class="clear-logs-btn" id="clear-logs-btn" title="Clear All Scan Logs" onclick="clearLogs()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></svg>
      Clear Logs
    </button>
    <!-- Mobile logs toggle -->
    <button class="mobile-logs-btn" id="mobile-logs-btn" title="View Scan Logs" onclick="toggleMobileLogs()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/></svg>
      Logs
    </button>
  </div>
</header>

<!-- ═══ BODY: 2-Panel ═══ -->
<div class="scanner-shell">

  <!-- ── LEFT: Main Scan Area ── -->
  <main class="scan-main-panel" id="scan-main-panel">

    <!-- Camera Card (hidden initially, shown on slot click) -->
    <div class="cam-card hidden" id="cam-card">
      <div class="cam-card-top">
        <div class="active-slot-indicator is-active" id="active-slot-indicator">
          <span class="asi-dot"></span>
          <span id="asi-label">—</span>
        </div>
        <button class="cam-close-btn" onclick="closeScanner()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          Stop Scanning
        </button>
      </div>
      <div class="cam-viewport" id="cam-viewport">
        <!-- New Html5Qrcode target -->
        <div id="qr-reader" style="width:100%; height:100%;"></div>
        
        <!-- Original video (hidden but kept for reference if needed) -->
        <video id="cam-video" autoplay muted playsinline class="hidden"></video>
        <div class="cam-overlay">
          <div class="cam-frame">
            <div class="cf cf-tl"></div><div class="cf cf-tr"></div>
            <div class="cf cf-bl"></div><div class="cf cf-br"></div>
            <div class="scan-line"></div>
          </div>
          <button id="btn-start-camera" class="start-btn" onclick="startCamera()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
            Start Camera
          </button>
        </div>
        <p class="cam-hint hidden" id="cam-hint">Align QR code within the frame</p>
      </div>
      <div class="scan-status-bar">
        <div class="scan-status" id="scan-status">Awaiting QR scan...</div>
        <button class="btn-simulate hidden" id="btn-simulate" onclick="simulateScan()">
          Simulate Scan
        </button>
      </div>
    </div>

    <!-- Day Schedule -->
    <div class="schedule-body" id="schedule-body">
      <!-- Day cards rendered by JS -->
      <div class="sched-skeleton">
        <div class="skeleton" style="height:28px;width:45%;margin-bottom:10px;border-radius:6px;"></div>
        <div class="skeleton" style="height:110px;border-radius:12px;margin-bottom:12px;"></div>
        <div class="skeleton" style="height:28px;width:45%;margin-bottom:10px;border-radius:6px;"></div>
        <div class="skeleton" style="height:110px;border-radius:12px;"></div>
      </div>
    </div>
  </main>

  <!-- ── RIGHT: Scan Logs Panel ── -->
  <aside class="scan-logs-panel">
    <div class="logs-header">
      <div class="logs-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
        Scan Logs
      </div>
      <div class="logs-count" id="logs-count">0 records</div>
    </div>

    <div class="logs-search-wrap">
      <svg class="logs-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" class="logs-search" id="logs-search" placeholder="Search by name or ID..." oninput="filterLogs()" />
    </div>

    <div class="logs-filters" id="logs-filters">
      <button class="log-filter-btn active" data-filter="all" onclick="setLogFilter('all', this)">All</button>
      <button class="log-filter-btn" data-filter="MORNING" onclick="setLogFilter('MORNING', this)">🌅 Morning</button>
      <button class="log-filter-btn" data-filter="AFTERNOON" onclick="setLogFilter('AFTERNOON', this)">☀️ Afternoon</button>
      <button class="log-filter-btn" data-filter="EVENING" onclick="setLogFilter('EVENING', this)">🌙 Evening</button>
      <button class="log-filter-btn log-filter-success" data-filter="SUCCESS" onclick="setLogFilter('SUCCESS', this)">✔ Success</button>
      <button class="log-filter-btn log-filter-success" data-filter="SUCCESS" onclick="setLogFilter('SUCCESS', this)">✔ Success</button>
    </div>

    <!-- Log column headers -->
    <div class="log-col-head">
      <span>Time</span>
      <span>Name / ID</span>
      <span>Status</span>
    </div>

    <div class="logs-list" id="logs-list">
      <div class="logs-empty">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <p>No scan records yet</p>
      </div>
    </div>
  </aside>

</div>

<!-- ═══ Mobile Backdrop + Drawer ═══ -->
<div class="mob-backdrop hidden" id="mob-backdrop" onclick="closeMobileLogs()"></div>
<div class="mob-logs-drawer hidden" id="mob-logs-drawer">
  <div class="mob-drawer-head">
    <span class="logs-title">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      Scan Logs
    </span>
    <button class="mob-close-btn" onclick="closeMobileLogs()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <div class="logs-search-wrap">
    <svg class="logs-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input type="text" class="logs-search" id="logs-search-mob" placeholder="Search by name or ID..." oninput="filterLogsMob()" />
  </div>
  <div class="logs-filters">
    <button class="log-filter-btn active" onclick="setLogFilterMob('all', this)">All</button>
    <button class="log-filter-btn" onclick="setLogFilterMob('MORNING', this)">🌅 Morning</button>
    <button class="log-filter-btn" onclick="setLogFilterMob('AFTERNOON', this)">☀️ Afternoon</button>
    <button class="log-filter-btn" onclick="setLogFilterMob('EVENING', this)">🌙 Evening</button>
    <button class="log-filter-btn log-filter-success" onclick="setLogFilterMob('SUCCESS', this)">✔ Success</button>
    <button class="log-filter-btn log-filter-success" onclick="setLogFilterMob('SUCCESS', this)">✔ Success</button>
  </div>
  <div class="log-col-head"><span>Time</span><span>Name / ID</span><span>Status</span></div>
  <div class="logs-list" id="logs-list-mob"></div>
</div>

<!-- ═══ Mobile Nav Drawer ═══ -->
<div class="mob-nav-drawer hidden" id="mob-nav-drawer">
  <div class="mob-drawer-head">
    <span class="logs-title">Navigation</span>
    <button class="mob-close-btn" onclick="closeMobileNav()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
  </div>
  <nav class="mob-nav-list">
    <a href="/index.html" class="mob-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Dashboard
    </a>
    <a href="/pages/pastors.html" class="mob-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.87"/></svg>
      Pastors
    </a>
    <a href="/pages/disciples.html" class="mob-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20v-2a8 8 0 0 1 16 0v2"/></svg>
      Disciples
    </a>
    <a href="/pages/conferences.html" class="mob-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      Conferences
    </a>
    <a href="/pages/badges.html" class="mob-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
      Badges
    </a>
    <a href="/pages/reports.html" class="mob-nav-item">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg>
      Reports
    </a>
  </nav>
</div>

<!-- ═══ Result Overlay ═══ -->
<div class="result-overlay hidden" id="result-overlay">
  <div class="result-card" id="result-card">
    <div class="result-icon" id="result-icon"></div>
    <div class="result-name" id="result-name">—</div>
    <div class="result-status-text" id="result-status-text">—</div>
    <div class="result-meta" id="result-meta"></div>
  </div>
</div>

<!-- ═══ Scripts ═══ -->
<script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
<script src="../js/libs/supabase.min.js?v=TESTING"></script>
<script src="../js/libs/jsqr.min.js?v=TESTING"></script>
<script src="../js/supabase.js?v=TESTING"></script>
<script src="../js/utils/helper.js?v=TESTING"></script>
<script src="../js/services/pastor.service.js?v=TESTING"></script>
<script src="../js/services/disciple.service.js?v=TESTING"></script>
<script src="../js/services/conference.service.js?v=TESTING"></script>
<script src="../js/services/attendance.service.js?v=TESTING"></script>
<script src="../js/services/scan_log.service.js?v=TESTING"></script>
<script src="../js/pages/scanner.js?v=TESTING"></script>
</body>
</html>
