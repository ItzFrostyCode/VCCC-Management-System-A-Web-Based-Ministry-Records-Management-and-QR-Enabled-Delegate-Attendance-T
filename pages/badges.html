    <!DOCTYPE html>
    <html lang="en">
    <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Badges — VCCC DAVAO MS</title>
    <link rel="stylesheet" href="../css/app.css" />
    <link rel="icon" type="image/png" href="../assets/VCCC-Logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages/badges.css" />
    </head>
    <body class="badges-page">
    <div class="app-shell">
    <aside class="sidebar">
        <a href="/index.html" class="sidebar-logo">
        <img src="../assets/VCCC-Logo.png" class="sidebar-logo-img" alt="VCCC Logo" />

        <a href="/pages/pastors.html"     class="nav-item" data-page="pastors"     data-tip="Pastors"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/><path d="M21 21v-2a4 4 0 0 0-3-3.87"/></svg></a>
        <a href="/pages/disciples.html"   class="nav-item" data-page="disciples"   data-tip="Disciples"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20v-2a8 8 0 0 1 16 0v2"/></svg></a>
        <div class="sidebar-divider"></div>
        <a href="/pages/conferences.html" class="nav-item" data-page="conferences" data-tip="Conferences"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg></a>
        <a href="/pages/badges.html"      class="nav-item" data-page="badges"      data-tip="Badges"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg></a>
        <a href="/pages/scanner.html"     class="nav-item" data-page="scanner"     data-tip="Scanner"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2"/><path d="M17 3h2a2 2 0 0 1 2 2v2"/><path d="M21 17v2a2 2 0 0 1-2 2h-2"/><path d="M7 21H5a2 2 0 0 1-2-2v-2"/><line x1="3" y1="12" x2="21" y2="12"/></svg></a>
        <a href="/pages/reports.html"     class="nav-item" data-page="reports"     data-tip="Reports"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg></a>
      <a href="/pages/admin_logs.html"  class="nav-item admin-only" data-page="logs" data-tip="Activity Logs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg></a>
    </nav>
        <div class="sidebar-bottom">
          <div class="sidebar-divider"></div>
          <button class="nav-item" id="btn-logout" data-tip="Sign Out" onclick="if(typeof authService !== 'undefined') authService.signOut().then(() => window.location.href='/pages/login.html')" style="cursor:pointer;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          </button>
        </div>
    </aside>
    <div class="app-main">
        <header class="topbar"><div class="topbar-title">Badge Generator</div></header>
        <main class="page-content">
        <div class="page-header">
            <span class="page-header-title">Badge Generator <small style="font-size:12px;opacity:.6;font-weight:400;margin-left:8px;">(8.89 x 6.35 cm)</small></span>
            <div class="page-header-actions">
            <button class="btn btn-ghost" id="btn-batch" style="display:none;">
                <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Download all (ZIP)
            </button>
            </div>
        </div>

        <!-- Mobile Panel Switcher (Visible only on Tablet/Mobile) -->
        <div class="mobile-panel-switcher">
          <button class="switch-btn" data-view="preview" onclick="switchMobileView('preview')">Preview</button>
          <button class="switch-btn active" data-view="delegates" onclick="switchMobileView('delegates')">Delegates</button>
          <button class="switch-btn" data-view="tools" onclick="switchMobileView('tools')">Tools</button>
        </div>

        <div class="badge-layout">
            <!-- 1. Tools Panel (Hidden on Mobile by default) -->
            <div class="view-panel view-tools" id="view-tools">
              <div class="tools-panel">
                <div class="panel-head">
                  <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2.5" fill="none"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                  Editor
                </div>
                <div class="tools-scroll" id="editor-fields-body">
                    <!-- Dynamically rendered via badges.js -->
                    <div style="padding:40px 20px;text-align:center;color:var(--text-3);font-size:13px;">Loading tools...</div>
                </div>
                <div class="tools-panel-footer">
                    <button class="btn btn-ghost btn-sm" onclick="resetConfig()" title="Reset to defaults">
                      <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    </button>
                </div>
              </div>
            </div>

            <div class="badge-main-content">
                <!-- 1. Delegate Panel (Left) - Active on Mobile by default -->
                <div class="view-panel view-delegates active" id="view-delegates">
                  <div class="delegate-panel">
                    <div class="panel-head">Search Delegate</div>
                    <div class="panel-filters">
                        <div class="filter-row">
                            <div class="search-wrap">
                                <svg viewBox="0 0 24 24" style="width:20px; height:20px; stroke:var(--text-3); fill:none; stroke-width:2.5;"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                                <input type="text" id="search-delegate" placeholder="Search by name, wife, or church..." oninput="applyFilters()" />
                            </div>
                            <div id="filter-district-badge"></div>
                            <div id="filter-church-badge"></div>
                        </div>
                        <div class="role-pills">
                        <button class="role-pill-btn on btn-pastor" data-role="PASTOR" onclick="toggleRole(this)">PASTOR</button>
                        <button class="role-pill-btn on btn-wife" data-role="WIFE" onclick="toggleRole(this)">WIFE</button>
                        <button class="role-pill-btn on btn-disciple" data-role="DISCIPLE" onclick="toggleRole(this)">DISCIPLE</button>
                        </div>
                    </div>
                    <div class="delegate-list" id="delegate-list"></div>
                  </div>
                </div>

                <!-- 2. Preview Panel (Right) -->
                <div class="view-panel view-preview" id="view-preview">
                  <div class="badge-panel">
                    <div class="panel-head">Badge Preview</div>
                    <div class="badge-preview-wrap" id="badge-preview-wrap">
                        <div class="no-selection">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="40" height="40"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
                        <p style="font-size:13px;margin:0;">Select a delegate to preview their badge</p>
                        </div>
                    </div>
                    <div class="badge-actions">
                        <button class="btn btn-primary" id="btn-download" onclick="downloadSingle()" disabled>
                        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> JPEG
                        </button>
                        <button class="btn btn-ghost" id="btn-print" onclick="printBadge()" disabled>
                        <svg viewBox="0 0 24 24"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg> Print
                        </button>
                        <div style="flex:1;"></div>
                        <button class="btn btn-ghost" id="btn-batch" style="display:none;">
                        <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        Zip all
                        </button>
                    </div>
                  </div>
                </div>
            </div>
        </div>

        <!-- Batch progress -->
        <div id="batch-progress" style="display:none;" class="card" style="padding:16px;">
            <div class="progress-wrap" style="padding:16px;">
            <div class="progress-bar"><div class="progress-fill" id="batch-fill" style="width:0%"></div></div>
            <div class="progress-label" id="batch-label">Rendering badges...</div>
            </div>
        </div>

        </main>
    </div>
    </div>

    <script src="../js/libs/supabase.min.js"></script>
    <script src="../js/libs/qrcode.min.js"></script>
    <script src="../js/libs/jszip.min.js"></script>
    <script src="../js/services/auth.service.js"></script>
    <script src="../js/supabase.js"></script><script src="../js/router.js"></script><script src="../js/utils/helper.js"></script>
    <script src="../js/services/district.service.js"></script><script src="../js/services/church.service.js"></script>
    <script src="../js/services/pastor.service.js"></script><script src="../js/services/disciple.service.js"></script>
    <script src="../js/pages/badges.js"></script>
    </body>
    </html>
